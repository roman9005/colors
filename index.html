<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Учим цвета</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Comic Sans MS','Segoe UI',Arial,sans-serif;background:linear-gradient(180deg,#87CEEB 0%,#FFD9A0 60%,#FFE5B4 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;overflow-x:hidden}

.sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.sun{position:absolute;top:6%;right:8%;font-size:70px;animation:sunPulse 4s ease-in-out infinite}
@keyframes sunPulse{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.1) rotate(15deg)}}
.cloud{position:absolute;font-size:50px;opacity:.85;animation:cloudDrift linear infinite}
@keyframes cloudDrift{0%{left:-100px}100%{left:110%}}
.hill{position:absolute;bottom:0;left:0;right:0;height:120px;background:radial-gradient(ellipse at 30% 100%,#7CB342,#558B2F);border-radius:50% 50% 0 0}
.butterfly{position:absolute;font-size:28px;animation:fly 14s linear infinite;z-index:999;pointer-events:none}
@keyframes fly{0%{left:-60px;top:15%}20%{top:8%}40%{top:35%}60%{top:20%}80%{top:40%}100%{left:110%;top:25%}}

.frame{width:100%;max-width:540px;background:rgba(255,255,255,.94);border-radius:32px;padding:14px;box-shadow:0 25px 60px rgba(0,0,0,.3),0 0 0 5px rgba(255,255,255,.5);display:flex;flex-direction:column;align-items:center;position:relative;z-index:1}

.progress{display:flex;gap:2px;justify-content:center;margin-bottom:8px;width:100%}
.progress .star{font-size:18px;filter:grayscale(1) opacity(.25);transition:all .4s cubic-bezier(.34,1.56,.64,1)}
.progress .star.done{filter:none;transform:scale(1.2)}

.top{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.score{background:linear-gradient(135deg,#FFD93D,#FFB800);padding:6px 16px;border-radius:30px;font-size:14px;font-weight:800;color:#7A3E00;box-shadow:0 4px 0 #E5A200}
.top-btns{display:flex;gap:6px}
.btn-icon{width:40px;height:40px;border-radius:50%;border:none;background:#fff;cursor:pointer;font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.15);display:inline-flex;align-items:center;justify-content:center}
.btn-icon:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}

.q{font-size:clamp(22px,5vw,32px);font-weight:900;color:#3A1F5C;text-align:center;margin:4px 0 10px;min-height:38px;text-shadow:2px 2px 0 rgba(255,255,255,.9)}

.repeat{background:linear-gradient(135deg,#4A9EFF,#3ED9C4);color:#fff;border:none;padding:8px 18px;border-radius:30px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #2A7ECC;margin-bottom:10px;font-family:inherit}
.repeat:active{transform:translateY(3px);box-shadow:0 1px 0 #2A7ECC}

.shapes{display:grid;gap:12px;width:100%}
.shapes.g2{grid-template-columns:repeat(2,1fr)}
.shapes.g4{grid-template-columns:repeat(2,1fr)}
.shapes.g6{grid-template-columns:repeat(3,1fr)}
.shape{border-radius:24px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s;aspect-ratio:1/1;box-shadow:0 10px 0 rgba(0,0,0,.3),0 14px 28px rgba(0,0,0,.25),inset 0 -8px 16px rgba(0,0,0,.15),inset 0 8px 16px rgba(255,255,255,.4);overflow:hidden}
.shape::before{content:'';position:absolute;top:6%;left:10%;width:35%;height:25%;background:radial-gradient(ellipse,rgba(255,255,255,.6),transparent 70%);border-radius:50%;pointer-events:none}
.shape::after{content:'';position:absolute;inset:0;border-radius:24px;background:linear-gradient(135deg,transparent 60%,rgba(255,255,255,.15));pointer-events:none}
.shape:active{transform:translateY(6px) scale(.98);box-shadow:0 4px 0 rgba(0,0,0,.3)}
.shape.ok{animation:pulse .7s ease}
.shape.no{animation:shake .5s ease}
.shape.hint{animation:hintGlow 1s ease-in-out infinite;z-index:5}
@keyframes hintGlow{
  0%,100%{box-shadow:0 10px 0 rgba(0,0,0,.3),0 14px 28px rgba(0,0,0,.25),inset 0 -8px 16px rgba(0,0,0,.15),inset 0 8px 16px rgba(255,255,255,.4)}
  50%{box-shadow:0 10px 0 rgba(0,0,0,.3),0 14px 28px rgba(0,0,0,.25),inset 0 -8px 16px rgba(0,0,0,.15),inset 0 8px 16px rgba(255,255,255,.4),0 0 0 6px #FFD700,0 0 30px #FFD700}
}
@keyframes pulse{0%{transform:scale(1)}30%{transform:scale(1.15)}60%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px) rotate(-3deg)}40%{transform:translateX(12px) rotate(3deg)}60%{transform:translateX(-8px) rotate(-2deg)}80%{transform:translateX(8px) rotate(2deg)}}
.shape .label{position:absolute;bottom:8px;left:0;right:0;font-size:13px;font-weight:900;color:#fff;text-shadow:2px 2px 4px rgba(0,0,0,.8),0 0 10px rgba(0,0,0,.6);text-transform:uppercase;letter-spacing:.5px;z-index:3;text-align:center;pointer-events:none}
.shapes.g6 .shape .label{font-size:10px}
.shapes.g2 .shape .label{font-size:16px}

/* ==================== МИШКА С КАРТИНКОЙ ==================== */
.bear-runner{
  position:fixed;
  z-index:800;
  width:110px;height:130px;
  pointer-events:none;
  transform-origin:center bottom;
  filter:
    drop-shadow(0 16px 24px rgba(60,30,10,.45))
    drop-shadow(0 4px 8px rgba(0,0,0,.3));
}
.bear-runner img{
  width:100%;height:100%;
  object-fit:contain;
  display:block;
  image-rendering:auto;
  transition:transform .3s;
}

/* Обычное состояние — дышит */
.bear-runner.idle{
  animation:bearBreathe 2.5s ease-in-out infinite;
  transition:left 1.2s cubic-bezier(.34,1.3,.64,1),top 1.2s cubic-bezier(.34,1.3,.64,1);
}
@keyframes bearBreathe{
  0%,100%{transform:translateY(0) rotate(-1deg) scale(1)}
  50%{transform:translateY(-4px) rotate(1deg) scale(1.02)}
}

/* Падение сверху — кувыркается */
.bear-runner.falling{animation:bearFall 1.4s cubic-bezier(.5,.05,.5,1) forwards}
@keyframes bearFall{
  0%{transform:translateY(-400px) rotate(0deg) scale(.5);opacity:0}
  20%{opacity:1}
  40%{transform:translateY(-200px) rotate(-180deg) scale(.8)}
  60%{transform:translateY(-80px) rotate(-360deg) scale(1)}
  80%{transform:translateY(10px) rotate(-540deg) scale(1.1)}
  90%{transform:translateY(-20px) rotate(-580deg) scale(1.05)}
  100%{transform:translateY(0) rotate(-600deg) scale(1)}
}
.bear-runner.landed{animation:bearLand 0.5s ease}
@keyframes bearLand{
  0%{transform:scale(1.2,0.7)}
  50%{transform:scale(0.85,1.15)}
  75%{transform:scale(1.05,0.95)}
  100%{transform:scale(1)}
}
.bear-runner.upsideDown{animation:bearUpsideDown 1.2s ease forwards}
@keyframes bearUpsideDown{0%{transform:rotate(0) scale(1)}100%{transform:rotate(180deg) scale(.95)}}
.bear-runner.hiding{animation:bearHide 0.8s ease forwards}
@keyframes bearHide{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(40px) scale(.7);opacity:.3}}
.bear-runner.peeking{animation:bearPeek 0.6s ease-in-out infinite}
@keyframes bearPeek{
  0%,100%{transform:translateY(0) rotate(-8deg) scale(1)}
  50%{transform:translateY(-14px) rotate(-3deg) scale(1.05)}
}
.bear-runner.pointing{animation:bearPoint 0.7s ease-in-out infinite;z-index:801}
@keyframes bearPoint{
  0%,100%{transform:translateY(0) rotate(-5deg) scale(1)}
  50%{transform:translateY(-10px) rotate(5deg) scale(1.08)}
}
.bear-runner.stick{animation:bearStick 1.5s ease-in-out infinite}
@keyframes bearStick{
  0%,100%{transform:translateY(0) rotate(0)}
  25%{transform:translateY(-4px) rotate(-3deg)}
  75%{transform:translateY(-4px) rotate(3deg)}
}
.bear-runner.happy{animation:bearHappyJump 1.2s ease}
@keyframes bearHappyJump{
  0%{transform:translateY(0) scale(1) rotate(0)}
  15%{transform:translateY(-50px) scale(1.2) rotate(-90deg)}
  30%{transform:translateY(0) scale(1) rotate(-180deg)}
  45%{transform:translateY(-40px) scale(1.15) rotate(-270deg)}
  60%{transform:translateY(0) scale(1) rotate(-360deg)}
  75%{transform:translateY(-20px) scale(1.05) rotate(-400deg)}
  100%{transform:translateY(0) scale(1) rotate(-360deg)}
}
.bear-runner.sad{animation:bearSadAnim 1.2s ease}
@keyframes bearSadAnim{
  0%,100%{transform:rotate(0) scale(1)}
  25%{transform:rotate(-15deg) scale(.9)}
  50%{transform:rotate(0) scale(.92)}
  75%{transform:rotate(15deg) scale(.9)}
}
.bear-runner.win{animation:bearWinSpin 1s ease-in-out infinite}
@keyframes bearWinSpin{
  0%{transform:rotate(0) scale(1)}
  50%{transform:rotate(360deg) scale(1.2)}
  100%{transform:rotate(720deg) scale(1)}
}

/* Указатель лапкой */
.bear-pointer{
  position:absolute;
  top:-36px;right:-24px;
  font-size:48px;
  opacity:0;
  transition:opacity .3s;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));
  animation:pointerDown 0.6s ease-in-out infinite;
}
@keyframes pointerDown{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(10px)}
}
.bear-runner.pointing .bear-pointer{opacity:1}

/* Палочка */
.bear-stick{
  position:absolute;
  top:-10px;right:-90px;
  width:90px;height:8px;
  background:linear-gradient(90deg,#8B5A2B 0%,#D89A5C 50%,#8B5A2B 100%);
  border-radius:4px;
  opacity:0;
  transform:rotate(-25deg);
  transform-origin:left center;
  transition:opacity .3s;
  box-shadow:0 2px 4px rgba(0,0,0,.4),inset 0 -2px 3px rgba(0,0,0,.3),inset 0 2px 3px rgba(255,220,180,.5);
}
.bear-stick::after{
  content:'';position:absolute;
  right:-6px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;
  background:radial-gradient(circle at 35% 30%, #FF6B9D 0%, #C13DDB 100%);
  border-radius:50%;
  box-shadow:0 2px 4px rgba(0,0,0,.4);
}
.bear-runner.stick .bear-stick{opacity:1;animation:stickPoint 1s ease-in-out infinite}
@keyframes stickPoint{
  0%,100%{transform:rotate(-25deg)}
  50%{transform:rotate(-15deg)}
}

/* ====== CSS-МИШКА (запасной вариант, если bear.png не найден) ====== */
.bear-css{display:none}
.bear-runner.no-img .bear-css{display:block}
.bear-runner.no-img .bear-img{display:none}

.bear-css .bear-body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:84px;height:76px;background:radial-gradient(circle at 35% 20%, rgba(255,220,180,.7) 0%, transparent 45%),radial-gradient(ellipse at 45% 55%, #D89A5C 0%, #B87538 40%, #8A5220 75%, #5C3110 100%);border-radius:50% 50% 48% 48% / 55% 55% 45% 45%;box-shadow:inset -14px -12px 24px rgba(60,30,10,.5),inset 12px 10px 24px rgba(255,230,200,.5);overflow:hidden}
.bear-css .bear-belly{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:50px;height:44px;background:radial-gradient(ellipse at 50% 30%, #F5DCB8 0%, #DEB888 60%, #C89858 100%);border-radius:50%;box-shadow:inset 0 -8px 14px rgba(60,30,10,.25),inset 0 6px 12px rgba(255,255,255,.6)}
.bear-css .bear-paw{position:absolute;width:30px;height:30px;background:radial-gradient(circle at 45% 45%, #B87538 0%, #8A5220 60%, #5C3110 100%);border-radius:50%;box-shadow:inset -5px -5px 10px rgba(60,30,10,.5),inset 4px 4px 8px rgba(255,220,180,.5);bottom:0;z-index:3}
.bear-css .bear-paw.left{left:-3px;transform:rotate(-10deg)}
.bear-css .bear-paw.right{right:-3px;transform:rotate(10deg)}
.bear-css .bear-paw::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:16px;height:16px;background:radial-gradient(circle at 40% 35%, #F5DCB8 0%, #DEB888 100%);border-radius:50%}
.bear-css .bear-head{position:absolute;top:0;left:50%;transform:translateX(-50%);width:88px;height:84px;background:radial-gradient(circle at 30% 20%, rgba(255,220,180,.75) 0%, transparent 50%),radial-gradient(ellipse at 45% 55%, #D89A5C 0%, #B87538 40%, #8A5220 75%, #5C3110 100%);border-radius:52% 52% 48% 48% / 55% 55% 45% 45%;box-shadow:inset -12px -10px 22px rgba(60,30,10,.45),inset 10px 8px 22px rgba(255,230,200,.55);z-index:2;overflow:hidden}
.bear-css .bear-ear{position:absolute;top:-14px;width:36px;height:36px;background:radial-gradient(circle at 50% 50%, #D89A5C 0%, #B87538 45%, #8A5220 100%);border-radius:50%;box-shadow:inset -5px -4px 10px rgba(60,30,10,.5),inset 4px 3px 8px rgba(255,220,180,.5);z-index:1}
.bear-css .bear-ear::before{content:'';position:absolute;top:9px;left:50%;transform:translateX(-50%);width:18px;height:18px;background:radial-gradient(circle at 40% 35%, #F5DCB8 0%, #DEB888 100%);border-radius:50%}
.bear-css .bear-ear.left{left:-10px}
.bear-css .bear-ear.right{right:-10px}
.bear-css .bear-face{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:58px;height:48px;background:radial-gradient(ellipse at 45% 30%, #FCEEDA 0%, #F5DCB8 50%, #DEB888 100%);border-radius:55% 55% 50% 50%;box-shadow:inset 0 -4px 8px rgba(60,30,10,.2),inset 0 4px 8px rgba(255,255,255,.75);z-index:3}
.bear-css .bear-nose{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:18px;height:13px;background:radial-gradient(circle at 35% 25%, #8B5A2B 0%, #4A2810 50%, #1A0A05 100%);border-radius:50% 50% 45% 45% / 60% 60% 40% 40%;box-shadow:inset 0 -3px 4px rgba(0,0,0,.8);z-index:4}
.bear-css .bear-mouth{position:absolute;top:23px;left:50%;transform:translateX(-50%);width:20px;height:10px;border-bottom:2.5px solid #4A2810;border-radius:0 0 50% 50%;z-index:4}
.bear-css .bear-eye{position:absolute;top:28px;width:16px;height:18px;background:radial-gradient(circle at 40% 30%, #6B4020 0%, #2B1608 50%, #000 100%);border-radius:50%;box-shadow:inset 0 2px 4px rgba(0,0,0,.8);z-index:5;animation:bearBlink 4.5s infinite}
.bear-css .bear-eye::before{content:'';position:absolute;top:2px;left:2px;width:6px;height:6px;background:radial-gradient(circle, #fff 0%, rgba(255,255,255,.9) 50%, transparent 100%);border-radius:50%}
.bear-css .bear-eye.left{left:13px}
.bear-css .bear-eye.right{right:13px}
@keyframes bearBlink{0%, 44%, 48%, 100%{transform:scaleY(1)}46%{transform:scaleY(.08)}}

/* ====== СТАРТОВЫЙ МИШКА ====== */
.bear-start{
  width:190px;height:220px;
  margin-bottom:20px;
  position:relative;
  animation:bearBreathe 2.5s ease-in-out infinite;
  transform-origin:center bottom;
  filter:
    drop-shadow(0 18px 28px rgba(60,30,10,.5))
    drop-shadow(0 6px 10px rgba(0,0,0,.3));
}
.bear-start img{
  width:100%;height:100%;
  object-fit:contain;
  display:block;
}
.bear-start .bear-css{display:none}
.bear-start.no-img .bear-css{display:block;position:relative;width:100%;height:100%}
.bear-start.no-img img{display:none}
.bear-start .bear-css .bear-body{width:150px;height:136px}
.bear-start .bear-css .bear-belly{width:88px;height:78px;bottom:24px}
.bear-start .bear-css .bear-head{width:156px;height:148px}
.bear-start .bear-css .bear-ear{width:60px;height:60px;top:-22px}
.bear-start .bear-css .bear-ear::before{width:30px;height:30px;top:14px}
.bear-start .bear-css .bear-ear.left{left:-16px}
.bear-start .bear-css .bear-ear.right{right:-16px}
.bear-start .bear-css .bear-face{width:100px;height:80px;bottom:4px}
.bear-start .bear-css .bear-nose{width:28px;height:20px;top:18px}
.bear-start .bear-css .bear-mouth{width:32px;height:16px;top:40px;border-bottom-width:3.5px}
.bear-start .bear-css .bear-eye{width:26px;height:30px;top:52px}
.bear-start .bear-css .bear-eye.left{left:24px}
.bear-start .bear-css .bear-eye.right{right:24px}
.bear-start .bear-css .bear-paw{width:52px;height:52px}
.bear-start .bear-css .bear-paw.left{left:-6px}
.bear-start .bear-css .bear-paw.right{right:-6px}
.bear-start .bear-css .bear-paw::before{width:28px;height:28px}

/* ==================== ОСТАЛЬНОЕ ==================== */
.particle{position:fixed;pointer-events:none;z-index:9999;font-size:24px;animation:particleFly 1.5s ease-out forwards}
@keyframes particleFly{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(1.5) rotate(720deg);opacity:0}}

.learn{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.learn.on{display:flex;animation:learnIn .4s ease}
@keyframes learnIn{0%{opacity:0}100%{opacity:1}}
.learn-box{background:#fff;border-radius:32px;padding:22px 18px;max-width:440px;width:100%;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,.5),0 0 0 6px rgba(255,255,255,.3);animation:learnBox .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes learnBox{0%{transform:scale(.5) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.learn-color-band{width:100%;height:14px;border-radius:8px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.2),inset 0 -2px 4px rgba(0,0,0,.15)}
.learn-items{display:flex;gap:10px;justify-content:center;margin-bottom:16px;flex-wrap:nowrap}
.learn-item{flex:1;aspect-ratio:1/1;border-radius:20px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.25),inset 0 0 30px rgba(0,0,0,.15)}
.learn-item img{width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))}
.learn-item .emoji{font-size:70px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))}
.learn-name{font-size:32px;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.learn-rhyme{font-size:16px;color:#5a4636;font-weight:700;line-height:1.4;margin-top:8px;padding:10px;background:#fff9e6;border-radius:12px;border:2px dashed #FFB800}

.win{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#FFE66D,#FF6B9D,#C86DD7);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;overflow:hidden}
.win.on{display:flex;animation:winFade .5s}
@keyframes winFade{0%{opacity:0}100%{opacity:1}}
.win h2{font-size:clamp(30px,7vw,50px);color:#fff;margin-bottom:12px;text-shadow:4px 4px 0 rgba(0,0,0,.2);z-index:2}
.win p{font-size:clamp(16px,4vw,22px);color:#fff;font-weight:700;margin-bottom:18px;z-index:2}
.win button{padding:18px 44px;font-size:20px;font-weight:900;color:#fff;border:none;border-radius:50px;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,#FF3D7F,#C13DDB);box-shadow:0 8px 0 #8B1A5C;z-index:2}
.win .stars-big{display:flex;gap:8px;margin-bottom:20px;z-index:2}
.win .stars-big span{font-size:36px;animation:starBounce .8s ease-in-out infinite}
.win .stars-big span:nth-child(2){animation-delay:.15s}
.win .stars-big span:nth-child(3){animation-delay:.3s}
@keyframes starBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}

.salute{position:fixed;font-size:34px;pointer-events:none;z-index:9998;animation:saluteFly 2.5s ease-out forwards}
@keyframes saluteFly{0%{transform:translateY(0) scale(.5) rotate(0);opacity:1}100%{transform:translateY(-110vh) scale(1.6) rotate(900deg);opacity:0}}

.start{position:fixed;inset:0;z-index:200;background:linear-gradient(180deg,#87CEEB 0%,#FFD9A0 60%,#FFE5B4 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;overflow:hidden}
.start.off{display:none}
.start .sun{position:absolute;top:5%;right:8%;font-size:80px;animation:sunPulse 4s ease-in-out infinite}
.start h1{font-size:clamp(30px,8vw,54px);color:#fff;margin-bottom:10px;text-shadow:4px 4px 0 rgba(0,0,0,.15);z-index:2}
.start p{font-size:clamp(15px,4vw,20px);color:#fff;margin-bottom:28px;font-weight:700;text-shadow:2px 2px 0 rgba(0,0,0,.15);z-index:2}
.start button{padding:24px 60px;font-size:clamp(22px,6vw,34px);font-weight:900;color:#FF3D7F;background:#fff;border:none;border-radius:100px;cursor:pointer;font-family:inherit;box-shadow:0 12px 0 rgba(0,0,0,.2);animation:hb 1.8s ease-in-out infinite;z-index:2}

<script>
const DEFAULTS = { diff: 4, timeMs: 8000, vol: 0.12, musicOn: true, soundOn: true };
let settings = {...DEFAULTS};
try {
  const s = JSON.parse(localStorage.getItem('igra_nastr') || 'null');
  if (s) settings = {...DEFAULTS, ...s};
} catch(e) {}
function saveSettings() { try { localStorage.setItem('igra_nastr', JSON.stringify(settings)); } catch(e) {} }

const COLORS = [
  { name:'красный', hex:'#FF1744', file:'q_red.mp3', rhymeFile:'rhyme_red.mp3',

    items:[{e:'☕',f:'img_lightblue_1.jpg',old:'img_lightblue.jpg'},{e:'🏞️',f:'img_lightblue_2.jpg'},{e:'💧',f:'img_lightblue_3.jpg'}] },

    items:[{e:'🐱',f:'img_black_1.jpg',old:'img_black.jpg'},{e:'🐧',f:'img_black_2.jpg'},{e:'⚫',f:'img_black_3.jpg'}] },
  { name:'белый', hex:'#FFFFFF', file:'q_white.mp3', rhymeFile:'rhyme_white.mp3',

    items:[{e:'🐰',f:'img_white_1.jpg',old:'img_white.jpg'},{e:'🍬',f:'img_white_2.jpg'},{e:'❄️',f:'img_white_3.jpg'}] },
  { name:'серый', hex:'#757575', file:'q_gray.mp3', rhymeFile:'rhyme_gray.mp3',
    rhyme:'Серый — слоник и волчок!',
    items:[{e:'🐘',f:'img_gray_1.jpg',old:'img_gray.jpg'},{e:'🐺',f:'img_gray_2.jpg'},{e:'🐭',f:'img_gray_3.jpg'}] }
];

const ROUNDS = 10;
let score = 0, round = 0, target = null;
let soundOn = true, musicOn = true, locked = false, started = false;
let currentAudio = null;
let imageAvailable = {};
let statusTimer = null;
let hintTimer = null;
let runTimer = null;
let hintShown = false;
let bearFacingRight = true;

const bear = document.getElementById('bearRunner');
const BEAR_W = 110, BEAR_H = 130;

// ====== УПРАВЛЕНИЕ МИШКОЙ ======
function bearTeleport(x, y) {
  bear.style.transition = 'none';
  bear.style.left = x + 'px';
  bear.style.top = y + 'px';
  void bear.offsetWidth;
  bear.style.transition = 'left 1.2s cubic-bezier(.34,1.3,.64,1),top 1.2s cubic-bezier(.34,1.3,.64,1)';
}
function bearRunTo(x, y) {
  const currentX = parseFloat(bear.style.left) || 0;
  // Поворачиваем мишку в сторону движения
  if (x > currentX + 10 && !bearFacingRight) {
    bearFacingRight = true;
    const img = bear.querySelector('img');
    if (img) img.style.transform = 'scaleX(1)';
  } else if (x < currentX - 10 && bearFacingRight) {
    bearFacingRight = false;
    const img = bear.querySelector('img');
    if (img) img.style.transform = 'scaleX(-1)';
  }
  bear.style.left = x + 'px';
  bear.style.top = y + 'px';
}
function bearClearClasses() {
  bear.classList.remove('idle','falling','landed','upsideDown','hiding','peeking','pointing','stick','happy','sad','win');
}

function bearFallFrom() {
  bearClearClasses();
  bear.classList.add('falling');
  setTimeout(() => {
    bear.classList.remove('falling');
    bear.classList.add('landed');
    setTimeout(() => {
      bear.classList.remove('landed');
      bear.classList.add('idle');
    }, 600);
  }, 1400);
}

function bearPointTo(element) {
  bearClearClasses();
  if (element) {
    const r = element.getBoundingClientRect();
    const x = r.left + r.width / 2 - BEAR_W / 2;
    const y = r.top + r.height / 2 - BEAR_H / 2;
    bearRunTo(x, y);
    setTimeout(() => bear.classList.add('pointing'), 1000);
  }
}

function bearStickTo(element) {
  bearClearClasses();
  if (element) {
    const r = element.getBoundingClientRect();
    const x = r.left - BEAR_W - 20;
    const y = r.top + r.height / 2 - BEAR_H / 2;
    if (x < 10) {
      bearRunTo(r.right + 10, y);
      const img = bear.querySelector('img');
      if (img) img.style.transform = 'scaleX(-1)';
      bearFacingRight = false;
    } else {
      bearRunTo(x, y);
      const img = bear.querySelector('img');
      if (img) img.style.transform = 'scaleX(1)';
      bearFacingRight = true;
    }
    setTimeout(() => bear.classList.add('stick'), 1000);
  }
}

function bearRandomSpot() {
  const w = window.innerWidth, h = window.innerHeight;
  return { x: 15 + Math.random() * (w - BEAR_W - 30), y: h * (0.15 + Math.random() * 0.7) };
}
function startBearWalk() {
  stopBearWalk();
  bearClearClasses();
  bear.classList.add('idle');
  const walk = () => {
    if (!started || locked) return;
    const spot = bearRandomSpot();
    bearRunTo(spot.x, spot.y);
    runTimer = setTimeout(walk, 2400 + Math.random() * 1800);
  };
  walk();
}
function stopBearWalk() { if (runTimer) { clearTimeout(runTimer); runTimer = null; } }

function bearHappyMove() {
  stopBearWalk();
  bearClearClasses();
  bear.classList.add('happy');
  const cx = window.innerWidth / 2 - BEAR_W / 2;
  const cy = window.innerHeight / 2 - BEAR_H / 2;
  bearRunTo(cx, cy);
  setTimeout(() => { bear.classList.remove('happy'); bear.classList.add('idle'); }, 1400);
}
function bearSadMove() {
  bearClearClasses();
  bear.classList.add('sad');
  setTimeout(() => { bear.classList.remove('sad'); bear.classList.add('idle'); }, 1200);
}

// ====== УТИЛИТЫ ======
function setStatus(m, bg, autoHide) {
  const el = document.getElementById('status');
  el.textContent = m;
  el.style.background = bg || 'rgba(0,0,0,.85)';
  el.classList.remove('hide');
  if (autoHide) {
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => el.classList.add('hide'), 2500);
  }
}

function drawProgress() {
  const p = document.getElementById('progress');
  p.innerHTML = '';
  for (let i = 0; i < ROUNDS; i++) {
    const s = document.createElement('span');
    s.className = 'star' + (i < round ? ' done' : '');
    s.textContent = '⭐';
    p.appendChild(s);
  }
}

function unlockAudio() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!window._ctx) window._ctx = new Ctx();
    if (window._ctx.state === 'suspended') window._ctx.resume();
    const osc = window._ctx.createOscillator();
    const gain = window._ctx.createGain();
    gain.gain.value = 0.0001;
    osc.connect(gain); gain.connect(window._ctx.destination);
    osc.start(); osc.stop(window._ctx.currentTime + 0.01);
  } catch(e) {}
}

function checkImage(name) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = 'images/' + name;
    setTimeout(() => resolve(false), 2000);
  });
}
function checkAllImages() {
  const checks = [];
  COLORS.forEach(c => {
    c.items.forEach(it => {
      checks.push(checkImage(it.f).then(ok => { imageAvailable[it.f] = ok; }));
      if (it.old) checks.push(checkImage(it.old).then(ok => { imageAvailable[it.old] = ok; }));
    });
  });
  return Promise.all(checks);
}

const NOTE = { C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880,R:0 };
const MELODY = [
  ['C5',0.5],['E5',0.5],['G5',0.5],['E5',0.5],
  ['F5',0.5],['D5',0.5],['C5',1.0],
  ['D5',0.5],['F5',0.5],['A5',0.5],['F5',0.5],
  ['G5',0.5],['E5',0.5],['C5',1.0],
  ['E5',0.5],['G5',0.5],['C5',0.5],['G5',0.5],
  ['A5',0.5],['F5',0.5],['D5',1.0],
  ['C5',0.5],['D5',0.5],['E5',0.5],['F5',0.5],
  ['G5',0.5],['E5',0.5],['C5',1.5],
  ['R',0.5]
];
const BEAT_MS = 340;
let musicTimer = null, musicGainNode = null;

function ensureMusicGain() {
  if (musicGainNode || !window._ctx) return;
  musicGainNode = window._ctx.createGain();
  musicGainNode.gain.value = settings.vol;
  musicGainNode.connect(window._ctx.destination);
}
function playMusicNote(freq, dur) {
  if (!musicOn || !freq || !window._ctx) return;
  ensureMusicGain();
  if (musicGainNode) musicGainNode.gain.value = settings.vol;
  const now = window._ctx.currentTime;
  const d = dur * BEAT_MS / 1000;
  const o = window._ctx.createOscillator();
  const g = window._ctx.createGain();
  o.type = 'triangle'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, now);
  g.gain.linearRampToValueAtTime(1, now + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, now + d);
  o.connect(g); g.connect(musicGainNode);
  o.start(now); o.stop(now + d);
}
function startMusic() {
  if (!musicOn || musicTimer || !window._ctx || settings.vol === 0) return;
  let i = 0;
  const next = () => {
    if (!musicOn) { musicTimer = null; return; }
    const [n, d] = MELODY[i];
    playMusicNote(NOTE[n], d);
    musicTimer = setTimeout(next, d * BEAT_MS);
    i = (i + 1) % MELODY.length;
  };
  next();
}
function pauseMusic() { if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; } }
function toggleMusic() {
  unlockAudio();
  musicOn = !musicOn;
  settings.musicOn = musicOn;
  saveSettings();
  document.getElementById('musicBtn').textContent = musicOn ? '🎵' : '🔕';
  if (musicOn) startMusic(); else pauseMusic();
}

let musicPausedBySpeech = false;
function playMp3(mp3, fb, cb) {
  if (!soundOn) { if (cb) cb(); return; }
  if (musicTimer) { pauseMusic(); musicPausedBySpeech = true; }
  if (currentAudio) { try { currentAudio.pause(); } catch(e) {} currentAudio = null; }
  let failed = false;
  const fallback = () => {
    if (failed) return;
    failed = true;
    if (fb) sayVoiceOnly(fb, cb); else if (cb) cb();
  };
  try {
    const a = new Audio('sounds/' + mp3);
    a.volume = 1.0;
    currentAudio = a;
    a.onerror = fallback;
    a.onended = () => {
      if (musicPausedBySpeech && musicOn) { musicPausedBySpeech = false; startMusic(); }
      if (cb) cb();
    };
    const p = a.play();
    if (p && typeof p.then === 'function') {
      p.then(() => setStatus('▶ ' + mp3, 'rgba(0,120,0,.9)', true)).catch(fallback);
    }
  } catch(e) { fallback(); }
}

function sayVoiceOnly(text, cb) {
  if (!soundOn || !('speechSynthesis' in window)) { if (cb) cb(); return; }
  try {
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    setTimeout(() => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ru-RU'; u.rate = 0.85; u.pitch = 1.15;
      const v = speechSynthesis.getVoices().find(x => x.lang && x.lang.toLowerCase().startsWith('ru'));
      if (v) u.voice = v;
      let done = false;
      const fin = () => {
        if (done) return;
        done = true;
        if (musicPausedBySpeech && musicOn) { musicPausedBySpeech = false; startMusic(); }
        if (cb) cb();
      };
      u.onend = fin; u.onerror = fin;
      setTimeout(fin, 12000);
      speechSynthesis.speak(u);
    }, 80);
  } catch(e) { if (cb) cb(); }
}

function explode(x, y, type) {
  const em = type === 'ok' ? ['⭐','✨','🌟','💫','🎉','❤️'] : ['💨','💧'];
  const n = type === 'ok' ? 12 : 6;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = em[Math.floor(Math.random() * em.length)];
    const a = (Math.PI * 2 * i) / n + Math.random() * 0.5;
    const d = 80 + Math.random() * 120;
    p.style.left = x + 'px'; p.style.top = y + 'px';
    p.style.setProperty('--tx', Math.cos(a) * d + 'px');
    p.style.setProperty('--ty', Math.sin(a) * d + 'px');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1600);
  }
}

function salute() {
  const em = ['⭐','✨','🌟','💫','🎉','🎊','🎈'];
  for (let i = 0; i < 40; i++) {
    setTimeout(() => {
      const s = document.createElement('div');
      s.className = 'salute';
      s.textContent = em[Math.floor(Math.random() * em.length)];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.bottom = '-60px';
      s.style.animationDelay = (Math.random() * 0.8) + 's';
      s.style.animationDuration = (1.8 + Math.random()) + 's';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 4000);
    }, i * 50);
  }
}

function shuffle(a) {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

const PRAISE = ['praise_1.mp3','praise_2.mp3','praise_3.mp3','praise_4.mp3'];
const ENC = ['enc_1.mp3','enc_2.mp3','enc_3.mp3'];

function showLearn(c, callback) {
  const modal = document.getElementById('learnModal');
  const band = document.getElementById('learnBand');
  const items = document.getElementById('learnItems');
  const nameEl = document.getElementById('learnName');
  const rhymeEl = document.getElementById('learnRhyme');
  band.style.background = c.hex;
  items.innerHTML = '';
  c.items.forEach(it => {
    const box = document.createElement('div');
    box.className = 'learn-item';
    box.style.background = c.hex;
    if (c.name === 'белый') box.style.border = '3px solid #E0E0E0';
    let src = null;
    if (imageAvailable[it.f]) src = it.f;
    else if (it.old && imageAvailable[it.old]) src = it.old;
    if (src) box.innerHTML = '<img src="images/' + src + '" alt="">';
    else box.innerHTML = '<span class="emoji">' + it.e + '</span>';
    items.appendChild(box);
  });
  nameEl.textContent = c.name.toUpperCase();
  nameEl.style.color = c.hex;
  rhymeEl.textContent = c.rhyme;
  modal.classList.add('on');
  setTimeout(() => {
    playMp3(c.rhymeFile, c.rhyme, () => {
      setTimeout(() => {
        modal.classList.remove('on');
        if (callback) callback();
      }, 800);
    });
  }, 500);
}

function startHintTimer() {
  clearTimeout(hintTimer);
  hintShown = false;
  if (!settings.timeMs) return;
  hintTimer = setTimeout(() => {
    if (locked || !started || !target) return;
    hintShown = true;
    const buttons = document.querySelectorAll('#shapes .shape');
    let targetBtn = null;
    buttons.forEach(b => {
      const label = b.querySelector('.label');
      if (label && label.textContent === target.name) targetBtn = b;
    });
    if (targetBtn) {
      targetBtn.classList.add('hint');
      const r = targetBtn.getBoundingClientRect();
      const spaceLeft = r.left - BEAR_W;
      const spaceRight = window.innerWidth - r.right - BEAR_W;
      if (spaceLeft > 20 || spaceRight > 20) {
        bearPointTo(targetBtn);
      } else {
        bearStickTo(targetBtn);
      }
      playMp3(target.file, 'Найди ' + target.name + '!', () => {
        setTimeout(() => sayVoiceOnly('Вот ' + target.name + '! Нажми сюда!'), 300);
      });
    }
  }, settings.timeMs);
}

function stopHint() {
  clearTimeout(hintTimer);
  document.querySelectorAll('#shapes .shape').forEach(b => b.classList.remove('hint'));
}

function startGame() {
  document.getElementById('startScreen').classList.add('off');
  started = true;
  unlockAudio();
  if (musicOn) setTimeout(() => startMusic(), 200);
  bearTeleport(window.innerWidth / 2 - BEAR_W / 2, -300);
  bearFallFrom();
  checkAllImages().then(() => {
    const found = Object.values(imageAvailable).filter(v => v).length;
    setStatus('📸 Картинок: ' + found, 'rgba(0,120,0,.9)', true);
  });
  playMp3('hello.mp3', 'Привет! Давай поиграем в цвета!', () => {
    setTimeout(newRound, 500);
  });
  setTimeout(startBearWalk, 3000);
}

function newRound() {
  stopHint();
  locked = false;
  target = COLORS[Math.floor(Math.random() * COLORS.length)];
  const count = settings.diff;
  const others = shuffle(COLORS.filter(c => c.name !== target.name)).slice(0, count - 1);
  const opts = shuffle([target, ...others]);
  document.getElementById('question').textContent = 'Найди ' + target.name + '!';
  const box = document.getElementById('shapes');
  box.className = 'shapes g' + count;
  box.innerHTML = '';
  opts.forEach(c => {
    const b = document.createElement('button');
    b.className = 'shape';
    b.style.background = c.hex;
    if (c.name === 'белый') b.style.border = '4px solid #E0E0E0';
    b.innerHTML = '<span class="label">' + c.name + '</span>';
    b.onclick = (e) => handleClick(c, b, e);
    box.appendChild(b);
  });
  setTimeout(() => playMp3(target.file, 'Найди ' + target.name + '!'), 300);
  startHintTimer();
  if (!runTimer) startBearWalk();
}

function repeatQuestion() {
  unlockAudio();
  if (!started) { setStatus('Сначала нажми ▶ ИГРАТЬ', 'rgba(180,80,0,.9)', true); return; }
  if (!target) { playMp3('hello.mp3', 'Привет! Давай поиграем в цвета!'); return; }
  playMp3(target.file, 'Найди ' + target.name + '!');
}

function handleClick(c, btn, e) {
  if (locked || !started) return;
  stopHint();
  const rect = btn.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  if (c.name === target.name) {
    locked = true;
    stopBearWalk();
    btn.classList.add('ok');
    explode(cx, cy, 'ok');
    score++; round++;
    document.getElementById('score').textContent = score;
    drawProgress();
    bearHappyMove();
    playMp3(pick(PRAISE), null, () => {
      showLearn(c, () => {
        if (round >= ROUNDS) showWin();
        else newRound();
      });
    });
  } else {
    btn.classList.add('no');
    explode(cx, cy, 'no');
    setTimeout(() => btn.classList.remove('no'), 500);
    bearSadMove();
    playMp3(pick(ENC), 'Ничего страшного! Попробуй ещё раз! Ищи ' + target.name + '!');
    startHintTimer();
  }
}

function showWin() {
  stopBearWalk();
  stopHint();
  document.getElementById('winScreen').classList.add('on');
  salute();
  bearClearClasses();
  bear.classList.add('win');
  bearRunTo(window.innerWidth / 2 - BEAR_W / 2, window.innerHeight / 2 - BEAR_H / 2);
  playMp3('win.mp3', 'Поздравляю! Ты выучил все цвета!');
}

function restartGame() {
  score = 0; round = 0;
  document.getElementById('score').textContent = '0';
  document.getElementById('winScreen').classList.remove('on');
  bearClearClasses();
  drawProgress();
  bearTeleport(window.innerWidth / 2 - BEAR_W / 2, -300);
  bearFallFrom();
  playMp3('lets_go.mp3', 'Молодец! Играем ещё раз!', () => {
    setTimeout(newRound, 500);
  });
  setTimeout(startBearWalk, 3000);
}

function toggleSound() {
  soundOn = !soundOn;
  settings.soundOn = soundOn;
  saveSettings();
  document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  if (!soundOn) {
    if (currentAudio) { try { currentAudio.pause(); } catch(e) {} }
    if ('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch(e) {} }
  } else unlockAudio();
}

function openSettings() { document.getElementById('settingsScreen').classList.add('on'); }
function closeSettings() { document.getElementById('settingsScreen').classList.remove('on'); saveSettings(); }
function setDiff(n, btn) {
  settings.diff = n;
  document.querySelectorAll('#optDiff button').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  saveSettings();
}
function setTime(ms, btn) {
  settings.timeMs = ms;
  document.querySelectorAll('#optTime button').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  saveSettings();
  if (started && !locked) startHintTimer();
}
function setVol(v, btn) {
  settings.vol = v;
  if (v === 0) { musicOn = false; pauseMusic(); document.getElementById('musicBtn').textContent = '🔕'; }
  else { musicOn = true; if (started) startMusic(); document.getElementById('musicBtn').textContent = '🎵'; }
  document.querySelectorAll('#optVol button').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  saveSettings();
}

bearTeleport(window.innerWidth / 2 - BEAR_W / 2, window.innerHeight * 0.35);
drawProgress();
document.getElementById('musicBtn').textContent = settings.musicOn ? '🎵' : '🔕';
document.getElementById('soundBtn').textContent = settings.soundOn ? '🔊' : '🔇';
</script>

</body>
