<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Учим цвета с Мишкой</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Comic Sans MS','Segoe UI',Arial,sans-serif;background:linear-gradient(180deg,#87CEEB 0%,#FFD9A0 60%,#FFE5B4 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;overflow-x:hidden}
  .sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .sun{position:absolute;top:6%;right:8%;font-size:70px;animation:sunPulse 4s ease-in-out infinite}
  @keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
  .cloud{position:absolute;font-size:50px;opacity:.85;animation:cloudDrift linear infinite}
  @keyframes cloudDrift{0%{left:-100px}100%{left:110%}}
  .hill{position:absolute;bottom:0;left:0;right:0;height:120px;background:radial-gradient(ellipse at 30% 100%,#7CB342,#558B2F);border-radius:50% 50% 0 0}
  
  .intro{position:fixed;inset:0;z-index:400;background:rgba(255,255,255,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;overflow:hidden}
  .intro.off{display:none}
  .intro h1{font-size:clamp(28px,7vw,48px);color:#3A1F5C;margin-bottom:14px;text-shadow:2px 2px 0 #fff}
  .intro button{padding:22px 56px;font-size:clamp(20px,5vw,28px);font-weight:900;color:#FF3D7F;background:#fff;border:none;border-radius:100px;cursor:pointer;box-shadow:0 10px 0 rgba(0,0,0,.2)}
  .intro button:active{transform:translateY(5px)}

  .frame{width:100%;max-width:540px;background:rgba(255,255,255,.94);border-radius:32px;padding:14px;box-shadow:0 25px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;position:relative;z-index:10;margin-top:140px}
  .top{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .score{background:#FFD93D;padding:6px 16px;border-radius:30px;font-size:14px;font-weight:800;color:#7A3E00}
  .bear-say{width:100%;background:#FFF9C4;border-radius:20px;padding:10px 16px;margin-bottom:8px;font-size:15px;font-weight:700;color:#7A3E00;text-align:center;min-height:42px;display:flex;align-items:center;justify-content:center}
  .q{font-size:clamp(22px,5vw,32px);font-weight:900;color:#3A1F5C;text-align:center;margin:4px 0 10px;min-height:38px}
  .shapes{display:grid;gap:12px;width:100%}
  .shapes.g2{grid-template-columns:repeat(2,1fr)}
  .shapes.g4{grid-template-columns:repeat(2,1fr)}
  .shapes.g6{grid-template-columns:repeat(3,1fr)}
  .shape{border-radius:24px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;box-shadow:0 10px 0 rgba(0,0,0,.3),0 14px 28px rgba(0,0,0,.25)}
  .shape:active{transform:translateY(6px)}
  .shape.no{animation:shake .5s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
  .shape .label{position:absolute;bottom:8px;left:0;right:0;font-size:13px;font-weight:900;color:#fff;text-shadow:2px 2px 4px rgba(0,0,0,.8);text-transform:uppercase;text-align:center}

  .bear-runner{position:fixed;z-index:20;width:100px;height:120px;pointer-events:none;transform-origin:center bottom;opacity:.95}
  .bear-runner img{width:100%;height:100%;object-fit:contain;display:block}
  .bear-runner.idle{animation:bearBreathe 2.5s ease-in-out infinite}
  @keyframes bearBreathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .bear-runner.sad{animation:bearSad 1.2s ease}
  @keyframes bearSad{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
  .bear-runner.pointing{animation:bearPoint .7s ease-in-out infinite}
  @keyframes bearPoint{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-8px) rotate(5deg)}}
</style>
</head>
<body>

<div class="sky">
  <div class="sun">☀️</div>
  <div class="cloud" style="top:10%;left:10%">☁️</div>
  <div class="cloud" style="top:25%;left:60%">☁️</div>
  <div class="hill"></div>
</div>

<!-- Экран старта -->
<div class="intro" id="introScreen">
  <h1>Привет, малыш! 🐻</h1>
  <p>Давай учить цвета вместе с мишкой!</p>
  <button onclick="startGame()">ИГРАТЬ</button>
</div>

<!-- Игровое поле -->
<div class="frame">
  <div class="top">
    <div class="score" id="score">Счёт: 0 / 5</div>
  </div>
  <div class="bear-say" id="sayBox"></div>
  <div class="q" id="question"></div>
  <div class="shapes" id="shapes"></div>
</div>

<!-- Мишка -->
<div class="bear-runner idle" id="bear">
  <img src="images/bear_idle.png" alt="bear" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22120%22><rect fill=%22%23FFD32A%22 width=%22100%22 height=%22120%22/></svg>'">
</div>

<script>
  // --- НАСТРОЙКИ И ДАННЫЕ ---
  const COLORS = [
    {name: 'красный', hex: '#FF5252', file: 'q_red.mp3', hintFile: 'hint_red.mp3'},
    {name: 'синий', hex: '#4A98FF', file: 'q_blue.mp3', hintFile: 'hint_blue.mp3'},
    {name: 'зелёный', hex: '#4CAF50', file: 'q_green.mp3', hintFile: 'hint_green.mp3'},
    {name: 'жёлтый', hex: '#FFEB3B', file: 'q_yellow.mp3', hintFile: 'hint_yellow.mp3'},
    {name: 'фиолетовый', hex: '#9C27B0', file: 'q_purple.mp3', hintFile: 'hint_purple.mp3'},
    {name: 'оранжевый', hex: '#FF9800', file: 'q_orange.mp3', hintFile: 'hint_orange.mp3'},
    {name: 'розовый', hex: '#E91E63', file: 'q_pink.mp3', hintFile: 'hint_pink.mp3'},
    {name: 'коричневый', hex: '#795548', file: 'q_brown.mp3', hintFile: 'hint_brown.mp3'},
    {name: 'чёрный', hex: '#000000', file: 'q_black.mp3', hintFile: 'hint_black.mp3'},
    {name: 'белый', hex: '#FFFFFF', file: 'q_white.mp3', hintFile: 'hint_white.mp3'}
  ];
  
  const PRAISE = ['praise_1.mp3', 'praise_2.mp3', 'praise_3.mp3', 'praise_4.mp3'];
  const ROUNDS = 5;
  
  // Состояние игры
  let score = 0, round = 0, locked = false, started = false;
  let target, opts;
  let audioCtx = null;
  let musicGainNode = null;
  let bgMusic = null;

  // Элементы DOM
  const el = {
    intro: document.getElementById('introScreen'),
    bear: document.getElementById('bear'),
    sayBox: document.getElementById('sayBox'),
    q: document.getElementById('question'),
    shapes: document.getElementById('shapes'),
    score: document.getElementById('score')
  };

  // --- АУДИО ЛОГИКА ---
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume();
    }
  }

  function playSound(filename) {
    if (!soundOn) return;
    initAudio();
    const audio = new Audio('sounds/' + filename);
    audio.volume = settings.vol;
    audio.play().catch(e => console.log('Audio blocked or missing:', filename));
  }

  function bearSays(text, soundFile) {
    el.sayBox.textContent = text;
    if (soundFile) playSound(soundFile);
  }

  // --- ИГРОВОЙ ЦИКЛ ---
  function startGame() {
    score = 0;
    round = 0;
    locked = false;
    started = true;
    el.intro.classList.add('off');
    el.bear.classList.remove('sad', 'pointing').classList.add('idle');
    newRound();
  }

  function newRound() {
    if (round >= ROUNDS) {
      // Победа
      el.q.textContent = '🎉 Ты молодец! 🎉';
      el.shapes.innerHTML = '';
      bearSays('Мы выучили все цвета! Ты супер!', 'win.mp3');
      el.bear.classList.remove('idle').classList.add('happy');
      return;
    }

    locked = true;
    round++;
    el.score.textContent = 'Счёт: ' + score + ' / ' + ROUNDS;
    
    // Выбираем правильный цвет и варианты
    const idx = Math.floor(Math.random() * COLORS.length);
    target = COLORS[idx];
    
    // Генерируем варианты (2, 4 или 6 кнопок)
    const count = round <= 2 ? 2 : round <= 4 ? 4 : 6;
    opts = [];
    opts.push(target);
    while (opts.length < count) {
      const r = COLORS[Math.floor(Math.random() * COLORS.length)];
      if (!opts.includes(r)) opts.push(r);
    }
    // Перемешиваем
    opts.sort(() => Math.random() - 0.5);

    // Вопрос
    el.q.textContent = 'Найди цвет: «' + target.name.toUpperCase() + '»!';
    el.sayBox.textContent = '';
    
    // Рисуем кнопки
    el.shapes.className = 'shapes g' + count;
    el.shapes.innerHTML = '';
    opts.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'shape';
      btn.style.backgroundColor = c.hex;
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = c.name;
      btn.appendChild(label);
      btn.onclick = () => handleAnswer(c, btn);
      el.shapes.appendChild(btn);
    });

    locked = false;
    // Озвучиваем вопрос
    playSound(target.file);
  }

  function handleAnswer(color, btnEl) {
    if (locked) return;
    locked = true;

    if (color.name === target.name) {
      // Правильно
      score++;
      btnEl.classList.add('ok');
      bearSays('Ура! Правильно! 🎉', PRAISE[Math.floor(Math.random() * PRAISE.length)]);
      el.bear.classList.remove('sad', 'pointing').classList.add('happy');
      setTimeout(() => {
        el.bear.classList.remove('happy').classList.add('idle');
        newRound();
      }, 1200);
    } else {
      // Неправильно -> ГЛАВНОЕ ИСПРАВЛЕНИЕ ЗДЕСЬ
      btnEl.classList.add('no');
      el.bear.classList.remove('idle', 'happy').classList.add('sad', 'pointing');
      
      // Фраза: "Ничего страшного! Ищи [цвет]"
      const phrase = 'Ничего страшного! Ищи ' + target.name + '!';
      
      // Звук: используем hint_color.mp3 (они у тебя есть на фото)
      bearSays(phrase, target.hintFile);

      setTimeout(() => {
        el.bear.classList.remove('sad', 'pointing').classList.add('idle');
        // Не увеличиваем round, чтобы повторить тот же вопрос
        locked = false; 
        // Можно раскомментировать строку ниже, если хочешь, чтобы раунд считался даже при ошибке
        // round++; 
      }, 2000);
    }
  }

  // Заглушки для настроек, чтобы код не падал
  let soundOn = true;
  let settings = {vol: 0.8};

</script>
</body>
</html>
