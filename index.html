<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Игра</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  #game { display: block; width: 100%; height: 100%; }

  /* Стартовый оверлей — нужен для разблокировки Web Audio */
  #startOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.92);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff; z-index: 100;
    transition: opacity 0.6s ease;
  }
  #startOverlay.hidden { opacity: 0; pointer-events: none; }
  #startOverlay h1 { font-size: 2.4rem; margin-bottom: 1.5rem; letter-spacing: 2px; }
  #startBtn {
    padding: 1rem 3rem;
    font-size: 1.3rem;
    background: linear-gradient(135deg, #ff6b6b, #ffa500);
    border: none; border-radius: 50px;
    color: #fff; font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(255,107,107,0.5);
    transition: transform 0.2s;
  }
  #startBtn:active { transform: scale(0.95); }
  #startOverlay p { margin-top: 1.5rem; opacity: 0.6; font-size: 0.9rem; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="startOverlay">
  <h1>🎮 ИГРА</h1>
  <button id="startBtn">НАЧАТЬ</button>
  <p>Нажмите, чтобы включить звук</p>
</div>

<script>
/* ============================================================
   АУДИО-МЕНЕДЖЕР (Web Audio API)
   ============================================================ */
const AudioManager = {
  ctx: null,
  musicGain: null,
  sfxGain: null,
  musicSource: null,
  musicBuffer: null,
  started: false,

  async init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();

    // Шина музыки
    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.35;
    this.musicGain.connect(this.ctx.destination);

    // Шина эффектов
    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = 0.6;
    this.sfxGain.connect(this.ctx.destination);

    // Загружаем фоновую музыку
    await this.loadMusic();
  },

  async loadMusic() {
    // Вариант A: из внешнего файла
    // const res = await fetch('music.mp3');
    // const arr = await res.arrayBuffer();
    // this.musicBuffer = await this.ctx.decodeAudioData(arr);

    // Вариант B: генерируем процедурную музыку (без внешних файлов)
    this.musicBuffer = this.generateMusicBuffer(8); // 8 секунд
  },

  // Процедурная генерация ambient-музыки
  generateMusicBuffer(seconds) {
    const sr = this.ctx.sampleRate;
    const len = sr * seconds;
    const buf = this.ctx.createBuffer(2, len, sr);

    // Мягкий аккорд + лёгкое вибрато
    const notes = [220, 277.18, 329.63, 440]; // A major

    for (let ch = 0; ch < 2; ch++) {
      const data = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        const t = i / sr;
        let s = 0;
        for (let n = 0; n < notes.length; n++) {
          const f = notes[n] * (ch === 0 ? 1 : 1.003); // лёгкий рассинхрон
          s += Math.sin(2 * Math.PI * f * t) * 0.25;
        }
        // Медленная амплитудная модуляция (дыхание)
        const breath = 0.6 + 0.4 * Math.sin(2 * Math.PI * 0.1 * t);
        // Плавное затухание в конце буфера для бесшовного лупа
        const fade = Math.min(1, t / 0.5) * Math.min(1, (seconds - t) / 0.5);
        data[i] = s * breath * fade * 0.15;
      }
    }
    return buf;
  },

  // Запуск фоновой музыки (loop)
  playMusic() {
    if (!this.ctx || !this.musicBuffer) return;
    if (this.musicSource) return; // уже играет

    this.musicSource = this.ctx.createBufferSource();
    this.musicSource.buffer = this.musicBuffer;
    this.musicSource.loop = true;
    this.musicSource.connect(this.musicGain);
    this.musicSource.start(0);
  },

  stopMusic() {
    if (this.musicSource) {
      try { this.musicSource.stop(); } catch(e) {}
      this.musicSource.disconnect();
      this.musicSource = null;
    }
  },

  // Простой SFX-блип
  playBeep(freq = 440, dur = 0.1, type = 'sine') {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.3, this.ctx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
    osc.connect(g); g.connect(this.sfxGain);
    osc.start();
    osc.stop(this.ctx.currentTime + dur + 0.02);
  },

  async resume() {
    if (this.ctx && this.ctx.state === 'suspended') {
      await this.ctx.resume();
    }
  }
};

/* ============================================================
   СТАРТ ПО КЛИКУ (разблокировка аудио)
   ============================================================ */
const overlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');

startBtn.addEventListener('click', async () => {
  await AudioManager.init();
  await AudioManager.resume();
  AudioManager.playMusic();
  overlay.classList.add('hidden');
  setTimeout(() => overlay.remove(), 700);
  startGame();
});

// Резервная разблокировка — на первый touch/click по канвасу
function unlockAudio() {
  AudioManager.resume();
  if (AudioManager.ctx && AudioManager.musicBuffer && !AudioManager.musicSource) {
    AudioManager.playMusic();
  }
  window.removeEventListener('touchstart', unlockAudio);
  window.removeEventListener('click', unlockAudio);
}
window.addEventListener('touchstart', unlockAudio, { passive: true });
window.addEventListener('click', unlockAudio);

/* ============================================================
   ИГРА
   ============================================================ */
const canvas = document.getElementById('game');
const ctx2d = canvas.getContext('2d');

let W, H, DPR;
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx2d.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// --- Состояние ---
const player = { x: 100, y: 0, vy: 0, r: 18, onGround: false };
let platforms = [];
let targets = [];
let score = 0;
let lastTime = 0;
let gameStarted = false;

const GRAVITY = 1600;   // px/s^2
const JUMP_V = -650;    // px/s
const MOVE_SPEED = 280; // px/s

function resetLevel() {
  player.x = 100;
  player.y = H - 200;
  player.vy = 0;
  player.onGround = false;
  score = 0;

  platforms = [
    { x: 0,   y: H - 60,  w: W * 0.4, h: 60 },
    { x: W*0.5, y: H - 60, w: W * 0.5, h: 60 },
    { x: W*0.3, y: H - 220, w: 180, h: 20 },
    { x: W*0.6, y: H - 360, w: 180, h: 20 },
  ];

  targets = [];
  for (let i = 0; i < 6; i++) {
    targets.push({
      x: 120 + i * (W - 240) / 5,
      y: H - 300 - Math.random() * 120,
      r: 14,
      // ← последнее изменение: encFile внутри target
      encFile: null,
      collected: false
    });
  }
}

// --- Ввод ---
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ' && gameStarted) {
    e.preventDefault();
    tryJump();
  }
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function tryJump() {
  if (player.onGround) {
    player.vy = JUMP_V;
    player.onGround = false;
    AudioManager.playBeep(660, 0.12, 'square');
  }
}

// --- Физика ---
function updatePlayer(dt) {
  let ax = 0;
  if (keys['arrowleft'] || keys['a']) ax -= 1;
  if (keys['arrowright'] || keys['d']) ax += 1;
  player.x += ax * MOVE_SPEED * dt;
  player.x = Math.max(player.r, Math.min(W - player.r, player.x));

  player.vy += GRAVITY * dt;
  player.y += player.vy * dt;

  player.onGround = false;
  for (const p of platforms) {
    // сверху вниз
    if (player.vy >= 0 &&
        player.x + player.r > p.x &&
        player.x - player.r < p.x + p.w) {
      const prevBottom = player.y - player.vy * dt + player.r;
      const bottom = player.y + player.r;
      if (prevBottom <= p.y && bottom >= p.y) {
        player.y = p.y - player.r;
        player.vy = 0;
        player.onGround = true;
      }
    }
  }

  if (player.y > H + 200) {
    resetLevel();
  }
}

function checkTargets() {
  for (const t of targets) {
    if (t.collected) continue;
    const dx = player.x - t.x;
    const dy = player.y - t.y;
    if (dx*dx + dy*dy < (player.r + t.r) ** 2) {
      t.collected = true;
      score++;
      AudioManager.playBeep(880 + score * 40, 0.15, 'triangle');
    }
  }
  if (score === targets.length) {
    // уровень пройден
    AudioManager.playBeep(1200, 0.4, 'sine');
    setTimeout(resetLevel, 600);
  }
}

/* ============================================================
   РЕНДЕР
   ============================================================ */
function draw() {
  // фон
  const g = ctx2d.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1a1a2e');
  g.addColorStop(1, '#0f0f1a');
  ctx2d.fillStyle = g;
  ctx2d.fillRect(0, 0, W, H);

  // платформы
  ctx2d.fillStyle = '#3a3a5c';
  for (const p of platforms) {
    ctx2d.fillRect(p.x, p.y, p.w, p.h);
    ctx2d.fillStyle = 'rgba(120,120,200,0.5)';
    ctx2d.fillRect(p.x, p.y, p.w, 3);
    ctx2d.fillStyle = '#3a3a5c';
  }

  // цели
  for (const t of targets) {
    if (t.collected) continue;
    const pulse = 1 + 0.15 * Math.sin(performance.now() / 200 + t.x);
    const grd = ctx2d.createRadialGradient(t.x, t.y, 0, t.x, t.y, t.r * 2 * pulse);
    grd.addColorStop(0, '#ffd93d');
    grd.addColorStop(1, 'rgba(255,217,61,0)');
    ctx2d.fillStyle = grd;
    ctx2d.beginPath();
    ctx2d.arc(t.x, t.y, t.r * 2 * pulse, 0, Math.PI * 2);
    ctx2d.fill();

    ctx2d.fillStyle = '#ffd93d';
    ctx2d.beginPath();
    ctx2d.arc(t.x, t.y, t.r, 0, Math.PI * 2);
    ctx2d.fill();
  }

  // игрок
  const pg = ctx2d.createRadialGradient(
    player.x - 5, player.y - 5, 2,
    player.x, player.y, player.r
  );
  pg.addColorStop(0, '#7cf0ff');
  pg.addColorStop(1, '#0088cc');
  ctx2d.fillStyle = pg;
  ctx2d.beginPath();
  ctx2d.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx2d.fill();

  // HUD
  ctx2d.fillStyle = '#fff';
  ctx2d.font = 'bold 28px sans-serif';
  ctx2d.textAlign = 'left';
  ctx2d.fillText(`${score} / ${targets.length}`, 24, 48);
}

/* ============================================================
   ГЛАВНЫЙ ЦИКЛ
   ============================================================ */
function loop(now) {
  const dt = Math.min(0.033, (now - lastTime) / 1000 || 0);
  lastTime = now;

  if (gameStarted) {
    updatePlayer(dt);
    checkTargets();
  }
  draw();
  requestAnimationFrame(loop);
}

function startGame() {
  resetLevel();
  gameStarted = true;
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

// Пауза/возобновление музыки при уходе со вкладки
document.addEventListener('visibilitychange', () => {
  if (!AudioManager.ctx) return;
  if (document.hidden) {
    AudioManager.ctx.suspend();
  } else {
    AudioManager.ctx.resume();
  }
});
</script>
</body>
</html>
