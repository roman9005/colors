let score=0, round=0, target=null;

const bear = document.getElementById('bearRunner');

const BEAR_W = 100, BEAR_H = 120;

function setPose(pose) {
  if (!bearImages[pose]) return;
  bear.querySelectorAll('.pose-img').forEach(img => {
    img.classList.toggle('active', img.dataset.pose === pose);
  });
}
function startWalkFrames() {
  stopWalkFrames();
  walkFrameTimer = setInterval(() => {
    walkFrame = walkFrame===1?2:1;
    setPose('walk'+walkFrame);
  }, 220);
}
function stopWalkFrames() { if (walkFrameTimer){ clearInterval(walkFrameTimer); walkFrameTimer=null; } }
function startBlinking() {
  stopBlinking();
  blinkTimer = setInterval(() => {
    if (!bearImages.blink || locked || isHinting) return;
    setPose('blink');
    setTimeout(() => { if (!locked && started && !isHinting) setPose('idle'); }, 200);
  }, 4000);
}
function stopBlinking() { if (blinkTimer){ clearInterval(blinkTimer); blinkTimer=null; } }

function bearSays(text) {
  bearSay.textContent = '🐻 ' + text;
  bearBubble.textContent = text.length>20 ? text.slice(0,20)+'…' : text;
  bear.classList.add('talking');
  setTimeout(() => bear.classList.remove('talking'), 2200);
}
function bearClearClasses() {
  bear.classList.remove('idle','walking','falling','landed','pointing','happy','sad','win','sleeping','talking','front','thinking','dancing');
}
function bearTeleport(x,y) {
  bear.style.transition='none';
  bear.style.left=x+'px'; bear.style.top=y+'px';
  void bear.offsetWidth;
  bear.style.transition='left 1.2s cubic-bezier(.34,1.3,.64,1),top 1.2s cubic-bezier(.34,1.3,.64,1)';
}
function bearRunTo(x,y) { bear.style.left=x+'px'; bear.style.top=y+'px'; }

function clamp(x, y) {
  const w = window.innerWidth, h = window.innerHeight;
  const MIN_Y = 100;
  const MAX_Y = h - BEAR_H - 80;
  return {
    x: Math.max(10, Math.min(w - BEAR_W - 10, x)),
    y: Math.max(MIN_Y, Math.min(MAX_Y, y))
  };
}

function bearFallFrom() {
  bearClearClasses();
  bear.classList.add('falling','front');
  setPose('idle');
  setTimeout(() => {
    bear.classList.remove('falling');
    bear.classList.add('landed');
    setTimeout(() => {
      bear.classList.remove('landed','front');
      bear.classList.add('idle');
      setPose('idle');
      startBearWalk();
      startBlinking();
    }, 400);
  }, 1200);
}

function bearPointTo(element) {
  isHinting = true;
  stopBearWalk();
  stopBlinking();
  stopWalkFrames();
  clearTimeout(thinkTimer);
  clearTimeout(runTimer);
  bearClearClasses();
  bear.classList.add('front','pointing');
  setPose('sign');
  if (element) {
    const r = element.getBoundingClientRect();
    const x = r.left + r.width / 2 - BEAR_W / 2;
    const y = r.top + r.height / 2 - BEAR_H / 2;
    const p = clamp(x, y);
    bearTeleport(p.x, p.y);
    if (window._hintHoldInterval) clearInterval(window._hintHoldInterval);
    window._hintHoldInterval = setInterval(() => {
      if (!isHinting) { clearInterval(window._hintHoldInterval); return; }
      bearRunTo(p.x, p.y);
    }, 500);
  }
}

function bearWalkSpot() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const TOP_ZONE = 110 + Math.random() * 30;
  const BOTTOM_ZONE = h - BEAR_H - 80 - Math.random() * 20;
  atTop = !atTop;
  const y = atTop ? TOP_ZONE : BOTTOM_ZONE;
  const x = 20 + Math.random() * (w - BEAR_W - 40);
  return clamp(x, y);
}

function startBearWalk() {
  if (isHinting) return;
  stopBearWalk();
  bearClearClasses();
  bear.classList.add('walking');
  startWalkFrames();
  const walk = () => {
    if (!started || locked || isHinting) return;
    if (bearImages.backpack && Math.random() < 0.15) setPose('backpack');
    else startWalkFrames();
    const spot = bearWalkSpot();
    bearRunTo(spot.x, spot.y);
    runTimer = setTimeout(walk, 2500 + Math.random() * 1500);
  };
  walk();
}
function stopBearWalk() {
  if (runTimer) { clearTimeout(runTimer); runTimer = null; }
  stopWalkFrames();
}

function bearHappyMove() {
  isHinting = false;
  if (window._hintHoldInterval) { clearInterval(window._hintHoldInterval); window._hintHoldInterval = null; }
  stopBearWalk(); stopBlinking();
  bearClearClasses();
  bear.classList.add('happy','front');
  setPose('happy');
  setTimeout(() => {
    if (bearImages.heart) setPose('heart');
    setTimeout(() => {
      bear.classList.remove('happy','front');
      setPose('idle');
      startBearWalk();
      startBlinking();

}
function bearSadMove() {

function bearThinkMode() {

  }, 1300);

// ====== АУДИО КОНТЕКСТ (единый) ======
let audioCtx = null;
function getAudioCtx() {
  if (audioCtx) return audioCtx;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e){}
  return audioCtx;
}

function unlockAudio() {
  const ctx = getAudioCtx();
  if (ctx) {
    if (ctx.state === 'suspended') ctx.resume();
    // Слышимый щелчок — гарантирует разблокировку на iOS
    try {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      g.gain.value = 0.05;
      o.frequency.value = 440;
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.05);
    } catch(e){}
  }
}

// ====== МУЗЫКА ======
const NOTE = {C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880,R:0};
const MELODY = [['C5',0.5],['E5',0.5],['G5',0.5],['E5',0.5],['F5',0.5],['D5',0.5],['C5',1.0],['D5',0.5],['F5',0.5],['A5',0.5],['F5',0.5],['G5',0.5],['E5',0.5],['C5',1.0],['E5',0.5],['G5',0.5],['C5',0.5],['G5',0.5],['A5',0.5],['F5',0.5],['D5',1.0],['C5',0.5],['D5',0.5],['E5',0.5],['F5',0.5],['G5',0.5],['E5',0.5],['C5',1.5],['R',0.5]];
const BEAT_MS = 340;

function ensureMusicGain() {
  const ctx = getAudioCtx();
  if (!ctx || musicGainNode) return;
  musicGainNode = ctx.createGain();
  musicGainNode.gain.value = settings.vol;
  musicGainNode.connect(ctx.destination);
}

function playMusicNote(freq, dur) {
  const ctx = getAudioCtx();
  if (!musicOn || !freq || !ctx) return;
  ensureMusicGain();
  if (!musicGainNode) return;
  musicGainNode.gain.value = settings.vol;
  const now = ctx.currentTime;
  const d = dur * BEAT_MS / 1000;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, now);
  g.gain.linearRampToValueAtTime(1, now + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, now + d);
  o.connect(g); g.connect(musicGainNode);
  o.start(now); o.stop(now + d);
}

function startMusic() {
  if (!musicOn || musicTimer || settings.vol === 0) return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  ensureMusicGain();
  let i = 0;
  const next = () => {
    if (!musicOn) { musicTimer = null; return; }
    const [n, d] = MELODY[i];
    playMusicNote(NOTE[n], d);
    musicTimer = setTimeout(next, d * BEAT_MS);
    i = (i + 1) % MELODY.length;
  };
  next();
}

function pauseMusic() {
  if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; }
}

function toggleMusic() {
  unlockAudio();
  musicOn = !musicOn;
  settings.musicOn = musicOn;
  saveSettings();
  document.getElementById('musicBtn').textContent = musicOn ? '🎵' : '🔕';
  if (musicOn) startMusic(); else pauseMusic();
}

// ====== MP3 (главная очередь) ======
function playMp3(mp3, fb, cb) {
  if (!soundOn) { if (cb) cb(); return; }
  if (currentAudio) {
    try { currentAudio.pause(); currentAudio.currentTime = 0; } catch(e){}
    currentAudio = null;
  }
  const wasMusic = !!musicTimer;
  if (wasMusic) pauseMusic();
  let failed = false;
  const restore = () => {
    if (wasMusic && musicOn && !musicTimer) startMusic();
  };
  const fallback = () => {
    if(failed) return;
    failed = true;
    restore();
    if(cb) cb();
  };
  try {
    const a = new Audio('sounds/'+mp3);
    a.volume = 1.0;
    currentAudio = a;
    a.onerror = fallback;
    a.onended = () => { restore(); if(cb) cb(); };
    const p = a.play();
    if (p && typeof p.then === 'function') {
      p.then(() => setStatus('▶ '+mp3, 'rgba(0,120,0,.9)', true)).catch(fallback);
    }
    setTimeout(() => {
      if (failed) return;
      if (a.readyState === 0) fallback();
    }, 3000);
  } catch(e) { fallback(); }
}

// ====== HINT MP3 (отдельная очередь) ======
function playHintMp3(mp3) {
  if (!soundOn) return;
  // Останавливаем предыдущий hint если есть
  if (hintAudio) {
    try { hintAudio.pause(); hintAudio.currentTime = 0; } catch(e){}
    hintAudio = null;
  }
  // Останавливаем главную очередь mp3 если играет
  if (currentAudio) {
    try { currentAudio.pause(); currentAudio.currentTime = 0; } catch(e){}
    currentAudio = null;
  }
  const wasMusic = !!musicTimer;
  if (wasMusic) pauseMusic();
  try {
    const a = new Audio('sounds/' + mp3);
    a.volume = 1.0;
    hintAudio = a;
    const resume = () => {
      hintAudio = null;
      if (wasMusic && musicOn && !musicTimer) startMusic();
    };
    a.onerror = resume;
    a.onended = resume;
    const p = a.play();
    if (p && typeof p.then === 'function') {
      p.then(() => setStatus('▶ ' + mp3, 'rgba(0,120,0,.9)', true)).catch(resume);
    }
  } catch(e) {
    if (wasMusic && musicOn) startMusic();
  }
}

function sayVoiceOnly(text, cb) { if (cb) cb(); }

function setStatus(m,bg,autoHide){
  const el=document.getElementById('status');
  el.textContent=m;
  el.style.background=bg||'rgba(0,0,0,.85)';
  el.classList.remove('hide');
  if(autoHide){ clearTimeout(statusTimer); statusTimer=setTimeout(()=>el.classList.add('hide'),2500);}
}
function drawProgress(){
  const p=document.getElementById('progress');
  p.innerHTML='';
  for(let i=0;i<ROUNDS;i++){
    const s=document.createElement('span');
    s.className='star'+(i<round?' done':'');
    s.textContent='⭐';
    p.appendChild(s);
  }
}
function checkImage(name){
  return new Promise(r=>{
    const img=new Image();
    img.onload=()=>r(true);
    img.onerror=()=>r(false);
    img.src='images/'+name;
    setTimeout(()=>r(false),400);
  });
}
async function findBearImages() {
  const poses = ['idle','walk_1','walk_2','happy','heart','sad','sleep','sign','honey','wave','blink','dance','think','wow','yawn','glasses','backpack','strong'];
  const checks = poses.map(async (p) => {
    const key = p === 'walk_1' ? 'walk1' : p === 'walk_2' ? 'walk2' : p;
    const ok = await checkImage('bear_' + p + '.png');
    if (ok) bearImages[key] = true;
    return ok ? 1 : 0;
  });
  const results = await Promise.all(checks);
  return results.reduce((a,b)=>a+b, 0);
}
async function checkAllImages() {
  const checks = [];
  COLORS.forEach(c=>c.items.forEach(it=>{
    checks.push(checkImage(it.f).then(ok=>{ imageAvailable[it.f]=ok; }));
    if(it.old) checks.push(checkImage(it.old).then(ok=>{ imageAvailable[it.old]=ok; }));
  }));
  await Promise.all(checks);
}
function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
const PRAISE=['praise_1.mp3','praise_2.mp3','praise_3.mp3','praise_4.mp3'];

// ====== СТАРТ ======
function startGameFromIntro() {
  document.getElementById('introScreen').classList.add('off');
  unlockAudio();
  started = true;
  if (bearImages.wave) setPose('wave');
  else setPose('idle');
  bearTeleport(20, 140);
  bearFallFrom();
  // Музыку запускаем сразу
  if (musicOn) startMusic();
  // Фоновые проверки
  findBearImages().then(found => {
    setStatus('🐻 Мишек: '+found+'/18', found>=9 ? 'rgba(0,120,0,.9)' : 'rgba(180,120,0,.9)', true);
  }).catch(()=>{});
  checkAllImages().catch(()=>{});
  // Приветствие
  const helloText = 'Привет! Я — Мишка! Давай поиграем!';
  bearSays(helloText);
  playMp3('hello.mp3', null, () => {
    setTimeout(newRound, 400);
  });
}

function newRound() {
  stopHint();
  isHinting = false;
  if (window._hintHoldInterval) { clearInterval(window._hintHoldInterval); window._hintHoldInterval = null; }
  locked = false;
  target = COLORS[Math.floor(Math.random()*COLORS.length)];
  const count = settings.diff;
  const others = shuffle(COLORS.filter(c=>c.name!==target.name)).slice(0, count-1);
  const opts = shuffle([target, ...others]);
  document.getElementById('question').textContent = 'Найди ' + target.name + '!';
  bearSays('Найди ' + target.name + '!');
  const box = document.getElementById('shapes');
  box.className = 'shapes g' + count;
  box.innerHTML = '';
  opts.forEach(c => {
    const b = document.createElement('button');
    b.className = 'shape';
    b.style.background = c.hex;
    if (c.name==='белый') b.style.border = '4px solid #E0E0E0';
    b.innerHTML = '<span class="label">' + c.name + '</span>';
    b.onclick = (e) => handleClick(c, b, e);
    box.appendChild(b);
  });
  setTimeout(() => playMp3(target.file), 300);
  startHintTimer();
  if (!runTimer && !locked && !isHinting) startBearWalk();
  clearTimeout(thinkTimer);
  thinkTimer = setTimeout(() => {
    if (!locked && started && !isHinting) bearThinkMode();
  }, 3000);
}

function repeatQuestion() {
  unlockAudio();
  if (!started || !target) return;
  playMp3(target.file);
}

function handleClick(c, btn, e) {
  if (locked || !started) return;
  stopHint();
  isHinting = false;
  if (window._hintHoldInterval) { clearInterval(window._hintHoldInterval); window._hintHoldInterval = null; }
  const rect = btn.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  if (c.name === target.name) {
    locked = true;
    stopBearWalk();
    btn.classList.add('ok');
    explode(cx, cy, 'ok');
    score++; round++;
    document.getElementById('score').textContent = score;
    drawProgress();
    bearHappyMove();
    const praise = pick(['Молодец!','Умничка!','Правильно!']);
    bearSays(praise + ' Это ' + c.name + '!');
    playMp3(pick(PRAISE), null, () => {
      showLearn(c, () => {
        if (round >= ROUNDS) showWin();
        else newRound();
      });
    });
  } else {
    btn.classList.add('no');
    explode(cx, cy, 'no');
    setTimeout(()=>btn.classList.remove('no'), 500);
    if (bearImages.wow && !window._wowShown) {
      window._wowShown = true;
      setPose('wow');
      setTimeout(() => { if (!locked) setPose('idle'); }, 1200);
    }
    bearSadMove();
    const enc = 'Ничего страшного! Ищи ' + target.name + '!';
    bearSays(enc);
    playMp3(c.encFile, null, () => {
      startHintTimer();
    });
  }
}

function startHintTimer() {
  clearTimeout(hintTimer);
  if (!settings.timeMs) return;
  hintTimer = setTimeout(() => {
    if (locked || !started || !target || isHinting) return;
    if (bearImages.yawn) setPose('yawn');
    setTimeout(() => {
      if (locked) return;
      const buttons = document.querySelectorAll('#shapes .shape');
      let targetBtn = null;
      buttons.forEach(b => {
        const label = b.querySelector('.label');
        if (label && label.textContent === target.name) targetBtn = b;
      });
      if (targetBtn) {
        targetBtn.classList.add('hint');
        bearPointTo(targetBtn);
        const hint = 'Вот ' + target.name + '! Нажми сюда!';
        bearSays(hint);
        // Играем hint_<цвет>.mp3
        playHintMp3(target.hintFile);
      }
    }, 700);
  }, settings.timeMs);
}
function stopHint() {
  clearTimeout(hintTimer);
  clearTimeout(thinkTimer);
  document.querySelectorAll('#shapes .shape').forEach(b => b.classList.remove('hint'));
}

function showLearn(c, callback) {
  const modal = document.getElementById('learnModal');
  const band = document.getElementById('learnBand');
  const items = document.getElementById('learnItems');
  const nameEl = document.getElementById('learnName');
  const rhymeEl = document.getElementById('learnRhyme');
  const learnBear = document.getElementById('learnBear');
  band.style.background = c.hex;
  items.innerHTML = '';
  c.items.forEach(it => {
    const box = document.createElement('div');
    box.className = 'learn-item';
    box.style.background = c.hex;
    if (c.name==='белый') box.style.border = '3px solid #E0E0E0';
    let src = null;
    if (imageAvailable[it.f]) src = it.f;
    else if (it.old && imageAvailable[it.old]) src = it.old;
    if (src) box.innerHTML = '<img src="images/'+src+'" alt="">';
    else box.innerHTML = '<span class="emoji">'+it.e+'</span>';
    items.appendChild(box);
  });
  nameEl.textContent = c.name.toUpperCase();
  nameEl.style.color = c.hex;
  rhymeEl.textContent = c.rhyme;
  modal.classList.add('on');
  const poses = ['happy','heart','dance','strong'].filter(p => bearImages[p]);
  if (poses.length === 0) poses.push('idle');
  let lp = 0;
  const cycle = setInterval(() => {
    if (!modal.classList.contains('on')) { clearInterval(cycle); return; }
    lp = (lp+1) % poses.length;
    learnBear.querySelectorAll('.pose-img').forEach(img => {
      img.classList.toggle('active', img.dataset.pose === poses[lp]);
    });
  }, 1800);
  setTimeout(() => {
    playMp3(c.rhymeFile, null, () => {
      setTimeout(() => {
        clearInterval(cycle);
        modal.classList.remove('on');
        if (callback) callback();
      }, 600);
    });
  }, 300);
}

function showWin() {
  stopBearWalk(); stopHint(); stopBlinking();
  isHinting = false;
  if (window._hintHoldInterval) { clearInterval(window._hintHoldInterval); window._hintHoldInterval = null; }
  document.getElementById('winScreen').classList.add('on');
  salute();
  bearDanceMove();
  const winText = 'Ура! Ты выучил все цвета!';
  document.getElementById('winText').textContent = winText;
  bearSays(winText);
  playMp3('win.mp3');
}

function restartGame() {
  score=0; round=0;
  document.getElementById('score').textContent='0';
  document.getElementById('winScreen').classList.remove('on');
  bearClearClasses();
  drawProgress();
  window._wowShown = false;
  isHinting = false;
  if (window._hintHoldInterval) { clearInterval(window._hintHoldInterval); window._hintHoldInterval = null; }
  unlockAudio();
  if (musicOn && !musicTimer) startMusic();
  bearTeleport(20, 140);
  bearFallFrom();
  const rt = 'Молодец! Играем ещё раз!';
  bearSays(rt);
  playMp3('lets_go.mp3', null, () => { setTimeout(newRound, 700); });
}

function toggleSound() {
  soundOn = !soundOn;
  settings.soundOn = soundOn;
  saveSettings();
  document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  if (!soundOn) {
    if (currentAudio) { try{ currentAudio.pause(); }catch(e){} }
    if (hintAudio) { try{ hintAudio.pause(); }catch(e){} }
  } else unlockAudio();
}

function explode(x, y, type) {
  const em = type==='ok' ? ['⭐','✨','🌟','💫','🎉','❤️'] : ['💨','💧'];
  const n = type==='ok' ? 12 : 6;
  for (let i=0;i<n;i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = em[Math.floor(Math.random()*em.length)];
    const a = (Math.PI*2*i)/n + Math.random()*0.5;
    const d = 80 + Math.random()*120;
    p.style.left = x+'px'; p.style.top = y+'px';
    p.style.setProperty('--tx', Math.cos(a)*d+'px');
    p.style.setProperty('--ty', Math.sin(a)*d+'px');
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 1600);
  }
}

function salute() {
  const em = ['⭐','✨','🌟','💫','🎉','🎊','🎈'];
  for (let i=0;i<40;i++) {
    setTimeout(() => {
      const s = document.createElement('div');
      s.className = 'salute';
      s.textContent = em[Math.floor(Math.random()*em.length)];
      s.style.left = Math.random()*100+'vw';
      s.style.bottom = '-60px';
      s.style.animationDelay = (Math.random()*0.8)+'s';
      s.style.animationDuration = (1.8+Math.random())+'s';
      document.body.appendChild(s);
      setTimeout(()=>s.remove(), 4000);
    }, i*50);
  }
}

function openSettings(){ document.getElementById('settingsScreen').classList.add('on'); }
function closeSettings(){ document.getElementById('settingsScreen').classList.remove('on'); saveSettings(); }
function setDiff(n,btn){ settings.diff=n; document.querySelectorAll('#optDiff button').forEach(b=>b.classList.remove('sel')); btn.classList.add('sel'); saveSettings(); }
function setTime(ms,btn){ settings.timeMs=ms; document.querySelectorAll('#optTime button').forEach(b=>b.classList.remove('sel')); btn.classList.add('sel'); saveSettings(); if(started&&!locked) startHintTimer(); }
function setVol(v,btn){
  settings.vol=v;
  if(v===0){ musicOn=false; pauseMusic(); document.getElementById('musicBtn').textContent='🔕'; }
  else { musicOn=true; if(started) startMusic(); document.getElementById('musicBtn').textContent='🎵'; }
  document.querySelectorAll('#optVol button').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  saveSettings();
}

drawProgress();
document.getElementById('musicBtn').textContent = settings.musicOn ? '🎵' : '🔕';
document.getElementById('soundBtn').textContent = settings.soundOn ? '🔊' : '🔇';
</script>
