<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Учим цвета с Мишкой</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Comic Sans MS','Segoe UI',Arial,sans-serif;background:linear-gradient(180deg,#87CEEB 0%,#FFD9A0 60%,#FFE5B4 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;overflow-x:hidden}
  .sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .sun{position:absolute;top:6%;right:8%;font-size:70px;animation:sunPulse 4s ease-in-out infinite}
  @keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
  .cloud{position:absolute;font-size:50px;opacity:.85;animation:cloudDrift linear infinite}
  @keyframes cloudDrift{0%{left:-100px}100%{left:110%}}
  .hill{position:absolute;bottom:0;left:0;right:0;height:120px;background:radial-gradient(ellipse at 30% 100%,#7CB342,#558B2F);border-radius:50% 50% 0 0}

  .intro{position:fixed;inset:0;z-index:400;background:rgba(255,255,255,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
  .intro.off{display:none}
  .intro h1{font-size:clamp(28px,7vw,48px);color:#3A1F5C;margin-bottom:14px;text-shadow:2px 2px 0 #fff}
  .intro p{font-size:clamp(16px,4vw,22px);color:#5a4636;font-weight:700;margin-bottom:24px}
  .intro button{padding:22px 56px;font-size:clamp(20px,5vw,28px);font-weight:900;color:#FF3D7F;background:#fff;border:none;border-radius:100px;cursor:pointer;box-shadow:0 10px 0 rgba(0,0,0,.2);font-family:inherit;touch-action:manipulation}
  .intro button:active{transform:translateY(5px)}

  .frame{width:100%;max-width:540px;background:rgba(255,255,255,.94);border-radius:32px;padding:14px;box-shadow:0 25px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;position:relative;z-index:10;margin-top:140px}
  .top{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
  .score{background:#FFD93D;padding:6px 16px;border-radius:30px;font-size:14px;font-weight:800;color:#7A3E00}
  .top-btns{display:flex;gap:6px}
  .btn-icon{width:40px;height:40px;border-radius:50%;border:none;background:#fff;cursor:pointer;font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.15);display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation}
  .btn-icon:active{transform:translateY(3px)}
  .bear-say{width:100%;background:#FFF9C4;border-radius:20px;padding:10px 16px;margin-bottom:8px;font-size:15px;font-weight:700;color:#7A3E00;text-align:center;min-height:42px;display:flex;align-items:center;justify-content:center}
  .q{font-size:clamp(22px,5vw,32px);font-weight:900;color:#3A1F5C;text-align:center;margin:4px 0 10px;min-height:38px}
  .shapes{display:grid;gap:12px;width:100%}
  .shapes.g2{grid-template-columns:repeat(2,1fr)}
  .shapes.g4{grid-template-columns:repeat(2,1fr)}
  .shapes.g6{grid-template-columns:repeat(3,1fr)}
  .shape{position:relative;border-radius:24px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;box-shadow:0 10px 0 rgba(0,0,0,.3),0 14px 28px rgba(0,0,0,.25);touch-action:manipulation;transition:box-shadow .3s,transform .15s}
  .shape:active{transform:translateY(6px)}
  .shape.ok{animation:pulse .7s ease}
  .shape.no{animation:shake .5s ease}
  .shape.hint{box-shadow:0 0 0 6px #FFD700, 0 0 30px #FFD700 !important;animation:pulseHint 1s ease-in-out infinite}
  @keyframes pulseHint{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
  @keyframes pulse{0%{transform:scale(1)}30%{transform:scale(1.15)}60%{transform:scale(.95)}100%{transform:scale(1)}}
  .shape .label{position:absolute;bottom:8px;left:0;right:0;font-size:13px;font-weight:900;color:#fff;text-shadow:2px 2px 4px rgba(0,0,0,.85);text-transform:uppercase;text-align:center;pointer-events:none}
  .shape[data-white="1"]{border:3px solid #ccc}

  .bear-runner{position:fixed;z-index:20;width:100px;height:120px;pointer-events:none;transform-origin:center bottom;opacity:.98;transition:left 1s ease,top 1s ease;left:20px;top:140px}
  .bear-runner img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 6px 10px rgba(60,30,10,.35))}
  .bear-runner.idle img{animation:bearBreathe 2.5s ease-in-out infinite}
  @keyframes bearBreathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .bear-runner.sad img{animation:bearSad 1.2s ease}
  @keyframes bearSad{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
  .bear-runner.pointing img{animation:bearPoint .7s ease-in-out infinite}
  @keyframes bearPoint{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-10px) rotate(5deg)}}
  .bear-runner.happy img{animation:bearHappy 1.4s ease}
  @keyframes bearHappy{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-40px) scale(1.15)}60%{transform:translateY(0) scale(1)}80%{transform:translateY(-15px) scale(1.05)}100%{transform:translateY(0) scale(1)}}
  .bear-runner.walking img{animation:bearWalk .5s ease-in-out infinite}
  @keyframes bearWalk{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}

  .settings{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px}
  .settings.on{display:flex}
  .settings-box{background:#fff;border-radius:24px;padding:22px;max-width:400px;width:100%}
  .settings-box h3{color:#3A1F5C;font-size:22px;margin-bottom:14px;text-align:center}
  .settings-box label{display:block;color:#5a4636;font-weight:700;font-size:14px;margin:12px 0 6px}
  .settings-box .opt{display:flex;gap:6px;flex-wrap:wrap}
  .settings-box .opt button{flex:1;padding:10px 6px;border-radius:12px;border:2px solid #e8dcc8;background:#fdfaf5;cursor:pointer;font-weight:700;font-size:12px;color:#5a4636;font-family:inherit;touch-action:manipulation}
  .settings-box .opt button.sel{background:#FF3D7F;color:#fff;border-color:#FF3D7F}
  .settings-box .close{width:100%;margin-top:18px;padding:14px;border:none;border-radius:14px;background:#6b4226;color:#fff;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<div class="sky">
  <div class="sun">☀️</div>
  <div class="cloud" style="top:10%;animation-duration:30s">☁️</div>
  <div class="cloud" style="top:25%;animation-duration:40s;animation-delay:5s">☁️</div>
  <div class="hill"></div>
</div>

<div class="intro" id="introScreen">
  <h1>Привет, малыш! 🐻</h1>
  <p>Давай учить цвета вместе с мишкой!</p>
  <button onclick="startGame()">▶ ИГРАТЬ</button>
</div>

<div class="frame">
  <div class="top">
    <div class="score" id="score">Счёт: 0 / 10</div>
    <div class="top-btns">
      <button class="btn-icon" id="musicBtn" onclick="toggleMusic()">🎵</button>
      <button class="btn-icon" id="soundBtn" onclick="toggleSound()">🔊</button>
      <button class="btn-icon" onclick="openSettings()">⚙</button>
    </div>
  </div>
  <div class="bear-say" id="sayBox">Привет! Я — Мишка!</div>
  <div class="q" id="question">Нажми ▶ ИГРАТЬ</div>
  <div class="shapes" id="shapes"></div>
</div>

<div class="bear-runner idle" id="bear">
  <img id="bearImg" src="images/bear_idle.png" alt="Мишка">
</div>

<div class="settings" id="settingsScreen">
  <div class="settings-box">
    <h3>⚙ Настройки</h3>
    <label>Сложность:</label>
    <div class="opt" id="optDiff">
      <button data-val="2" onclick="setDiff(2,this)">Легко (2)</button>
      <button data-val="4" onclick="setDiff(4,this)" class="sel">Средне (4)</button>
      <button data-val="6" onclick="setDiff(6,this)">Сложно (6)</button>
    </div>
    <label>⏱ Подсказка через:</label>
    <div class="opt" id="optTime">
      <button data-val="5000" onclick="setTime(5000,this)">5 сек</button>
      <button data-val="10000" onclick="setTime(10000,this)" class="sel">10 сек</button>
      <button data-val="15000" onclick="setTime(15000,this)">15 сек</button>
    </div>
    <label>🎵 Громкость музыки:</label>
    <div class="opt" id="optVol">
      <button data-val="0" onclick="setVol(0,this)">Выкл</button>
      <button data-val="0.08" onclick="setVol(0.08,this)">Тихо</button>
      <button data-val="0.15" onclick="setVol(0.15,this)" class="sel">Средне</button>
      <button data-val="0.25" onclick="setVol(0.25,this)">Громко</button>
    </div>
    <button class="close" onclick="closeSettings()">✕ Закрыть</button>
  </div>
</div>

<script>
// ============================================================
//  НАСТРОЙКИ (сверху, чтобы были доступны везде)
// ============================================================
const DEFAULTS = { diff: 4, timeMs: 10000, vol: 0.15, soundOn: true, musicOn: true };
let settings = { ...DEFAULTS };
try {
  const s = JSON.parse(localStorage.getItem('igra_nastr') || 'null');
  if (s) settings = { ...DEFAULTS, ...s };
} catch (e) {}
function saveSettings() {
  try { localStorage.setItem('igra_nastr', JSON.stringify(settings)); } catch (e) {}
}

let soundOn = settings.soundOn;
let musicOn = settings.musicOn;

// ============================================================
//  ЦВЕТА
// ============================================================
const COLORS = [
  { name:'красный',    hex:'#FF1744', file:'q_red.mp3',       hintFile:'hint_red.mp3',       encFile:'enc_red.mp3' },
  { name:'синий',      hex:'#1565FF', file:'q_blue.mp3',      hintFile:'hint_blue.mp3',      encFile:'enc_blue.mp3' },
  { name:'зелёный',    hex:'#00C853', file:'q_green.mp3',     hintFile:'hint_green.mp3',     encFile:'enc_green.mp3' },
  { name:'жёлтый',     hex:'#FFD600', file:'q_yellow.mp3',    hintFile:'hint_yellow.mp3',    encFile:'enc_yellow.mp3' },
  { name:'фиолетовый', hex:'#9C27FF', file:'q_purple.mp3',    hintFile:'hint_purple.mp3',    encFile:'enc_purple.mp3' },
  { name:'оранжевый',  hex:'#FF6D00', file:'q_orange.mp3',    hintFile:'hint_orange.mp3',    encFile:'enc_orange.mp3' },
  { name:'розовый',    hex:'#FF1493', file:'q_pink.mp3',      hintFile:'hint_pink.mp3',      encFile:'enc_pink.mp3' },
  { name:'коричневый', hex:'#8D4A22', file:'q_brown.mp3',     hintFile:'hint_brown.mp3',     encFile:'enc_brown.mp3' },
  { name:'чёрный',     hex:'#111111', file:'q_black.mp3',     hintFile:'hint_black.mp3',     encFile:'enc_black.mp3' },
  { name:'белый',      hex:'#FFFFFF', file:'q_white.mp3',     hintFile:'hint_white.mp3',     encFile:'enc_white.mp3' }
];

const PRAISE = ['praise_1.mp3', 'praise_2.mp3', 'praise_3.mp3', 'praise_4.mp3'];
const ROUNDS = 10;

// ============================================================
//  СОСТОЯНИЕ
// ============================================================
let score = 0, round = 0, locked = false, started = false;
let target = null, opts = [];
let hintTimer = null, hintRepeatTimer = null;
let walkTimer = null;
let isHinting = false;
let currentVoice = null;
let currentHintVoice = null;

const el = {
  intro:  document.getElementById('introScreen'),
  bear:   document.getElementById('bear'),
  bearImg:document.getElementById('bearImg'),
  sayBox: document.getElementById('sayBox'),
  q:      document.getElementById('question'),
  shapes: document.getElementById('shapes'),
  score:  document.getElementById('score'),
  musicBtn: document.getElementById('musicBtn'),
  soundBtn: document.getElementById('soundBtn')
};

// ============================================================
//  AUDIO CONTEXT + ФОНОВАЯ МУЗЫКА
// ============================================================
let audioCtx = null;
let musicGainNode = null;
let musicTimer = null;
let musicWatchdog = null;

function getCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  return audioCtx;
}

function ensureMusicGain() {
  const ctx = getCtx();
  if (!ctx) return null;
  if (!musicGainNode) {
    musicGainNode = ctx.createGain();
    musicGainNode.connect(ctx.destination);
  }
  musicGainNode.gain.value = settings.vol;
  return musicGainNode;
}

// Простая весёлая мелодия
const NOTE = { C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00, B5:987.77, R:0 };
const MELODY = [
  ['C5',0.5],['E5',0.5],['G5',0.5],['E5',0.5],['F5',0.5],['D5',0.5],['C5',1.0],
  ['D5',0.5],['F5',0.5],['A5',0.5],['F5',0.5],['G5',0.5],['E5',0.5],['C5',1.0],
  ['E5',0.5],['G5',0.5],['C5',0.5],['G5',0.5],['A5',0.5],['F5',0.5],['D5',1.0],
  ['C5',0.5],['D5',0.5],['E5',0.5],['F5',0.5],['G5',0.5],['E5',0.5],['C5',1.5],['R',0.5]
];
const BEAT_MS = 380;

function playMusicNote(freq, dur) {
  if (!musicOn || !freq) return;
  const ctx = getCtx();
  const gain = ensureMusicGain();
  if (!ctx || !gain) return;
  const now = ctx.currentTime;
  const d = dur * BEAT_MS / 1000;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, now);
  g.gain.linearRampToValueAtTime(1, now + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, now + d);
  o.connect(g); g.connect(gain);
  o.start(now); o.stop(now + d);
}

function startMusic() {
  if (!musicOn || musicTimer) return;
  if (settings.vol === 0) return;
  const ctx = getCtx();
  if (!ctx) return;
  ensureMusicGain();
  let i = 0;
  const next = () => {
    if (!musicOn) { musicTimer = null; return; }
    const [n, d] = MELODY[i];
    playMusicNote(NOTE[n], d);
    musicTimer = setTimeout(next, d * BEAT_MS);
    i = (i + 1) % MELODY.length;
  };
  next();
  // Страховка: если через 2 сек музыка не заиграла — перезапуск
  clearTimeout(musicWatchdog);
  musicWatchdog = setTimeout(() => {
    if (musicOn && !musicTimer && started) startMusic();
  }, 2000);
}

function pauseMusic() {
  if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; }
  clearTimeout(musicWatchdog);
  musicWatchdog = null;
}

// ============================================================
//  УНИВЕРСАЛЬНОЕ ВОСПРОИЗВЕДЕНИЕ MP3
//  Пауза музыки → играет голос → возобновление музыки
// ============================================================
function playVoice(mp3, onEnd, isHintVoice) {
  if (!soundOn) { if (onEnd) onEnd(); return; }

  // Останавливаем предыдущий голос
  const prev = isHintVoice ? currentHintVoice : currentVoice;
  if (prev) {
    try { prev.pause(); prev.currentTime = 0; } catch (e) {}
  }

  // Пауза музыки
  const wasMusicPlaying = !!musicTimer;
  if (wasMusicPlaying) pauseMusic();

  // Возобновление музыки после голоса
  const resumeMusic = () => {
    if (wasMusicPlaying && musicOn && !musicTimer) {
      setTimeout(() => { if (musicOn && !musicTimer && started) startMusic(); }, 120);
    }
  };

  try {
    const audio = new Audio('sounds/' + mp3);
    audio.volume = 1.0;
    if (isHintVoice) currentHintVoice = audio; else currentVoice = audio;

    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      if (isHintVoice) currentHintVoice = null; else currentVoice = null;
      resumeMusic();
      if (onEnd) onEnd();
    };

    audio.onerror = finish;
    audio.onended = finish;
    const p = audio.play();
    if (p && typeof p.then === 'function') {
      p.catch(() => { finish(); });
    }
    // Таймаут — если файл не проигрался за 5 сек, считаем что "закончил"
    setTimeout(() => { if (!done && audio.readyState === 0) finish(); }, 5000);
  } catch (e) {
    resumeMusic();
    if (onEnd) onEnd();
  }
}

// ============================================================
//  ПОЗЫ МИШКИ
// ============================================================
function setBearPose(pose, img) {
  el.bear.classList.remove('idle', 'happy', 'sad', 'pointing', 'walking');
  if (pose) el.bear.classList.add(pose);
  if (img) el.bearImg.src = 'images/' + img;
}

function bearSay(text, mp3, isHint) {
  el.sayBox.textContent = '🐻 ' + text;
  if (mp3) playVoice(mp3, null, isHint);
}

// ============================================================
//  ХОДЬБА МИШКИ
// ============================================================
function startBearWalk() {
  stopBearWalk();
  if (!started || locked || isHinting) return;
  const walk = () => {
    if (!started || locked || isHinting) return;
    const w = window.innerWidth, h = window.innerHeight;
    const x = 20 + Math.random() * (w - 140);
    const y = Math.random() < 0.5
      ? 100 + Math.random() * 60
      : h - 260 + Math.random() * 40;
    el.bear.style.left = x + 'px';
    el.bear.style.top = y + 'px';
    setBearPose('walking', 'bear_walk_1.png');
    walkTimer = setTimeout(() => {
      el.bearImg.src = 'images/bear_walk_2.png';
      walkTimer = setTimeout(() => {
        if (!locked && !isHinting) setBearPose('idle', 'bear_idle.png');
        walkTimer = setTimeout(walk, 2000 + Math.random() * 1500);
      }, 400);
    }, 1200);
  };
  walkTimer = setTimeout(walk, 500);
}

function stopBearWalk() {
  if (walkTimer) { clearTimeout(walkTimer); walkTimer = null; }
}

// ============================================================
//  ПОДСКАЗКА — мишка идёт к правильной кнопке
// ============================================================
function moveBearToButton(btn) {
  const r = btn.getBoundingClientRect();
  const bearW = 100, bearH = 120;
  let x = r.left + r.width / 2 - bearW / 2;
  let y = r.top - bearH - 10;
  x = Math.max(10, Math.min(window.innerWidth - bearW - 10, x));
  y = Math.max(70, Math.min(window.innerHeight - bearH - 10, y));
  el.bear.style.left = x + 'px';
  el.bear.style.top = y + 'px';
}

function showHint() {
  if (locked || !started || !target || isHinting) return;

  const buttons = el.shapes.querySelectorAll('.shape');
  let targetBtn = null;
  buttons.forEach(b => {
    const lbl = b.querySelector('.label');
    if (lbl && lbl.textContent === target.name) targetBtn = b;
  });
  if (!targetBtn) return;

  isHinting = true;
  stopBearWalk();
  setBearPose('pointing', 'bear_sign.png');
  targetBtn.classList.add('hint');
  moveBearToButton(targetBtn);

  const hintText = 'Вот ' + target.name + '! Жми сюда!';
  el.sayBox.textContent = '🐻 ' + hintText;

  // Играем hint_<цвет>.mp3 — голос мишки
  playVoice(target.hintFile, null, true);

  // Повтор подсказки каждые 5 секунд, пока ребёнок не нажмёт
  if (hintRepeatTimer) clearInterval(hintRepeatTimer);
  hintRepeatTimer = setInterval(() => {
    if (locked || !isHinting) {
      clearInterval(hintRepeatTimer); hintRepeatTimer = null; return;
    }
    el.sayBox.textContent = '🐻 ' + hintText;
    moveBearToButton(targetBtn);
    playVoice(target.hintFile, null, true);
  }, 5000);
}

function stopHint() {
  clearTimeout(hintTimer); hintTimer = null;
  if (hintRepeatTimer) { clearInterval(hintRepeatTimer); hintRepeatTimer = null; }
  if (currentHintVoice) {
    try { currentHintVoice.pause(); currentHintVoice.currentTime = 0; } catch (e) {}
    currentHintVoice = null;
  }
  document.querySelectorAll('#shapes .shape').forEach(b => b.classList.remove('hint'));
  isHinting = false;
}

function startHintTimer() {
  clearTimeout(hintTimer);
  if (!settings.timeMs) return;
  hintTimer = setTimeout(() => {
    if (locked || !started || !target || isHinting) return;
    showHint();
  }, settings.timeMs);
}

// ============================================================
//  ИГРОВОЙ ЦИКЛ
// ============================================================
function startGame() {
  score = 0;
  round = 0;
  started = true;
  locked = false;

  // Разблокировка звука по клику
  getCtx();

  el.intro.classList.add('off');
  setBearPose('idle', 'bear_idle.png');
  el.bear.style.left = '20px';
  el.bear.style.top = '140px';

  // Приветствие + старт музыки после
  playVoice('hello.mp3', () => {
    if (musicOn) setTimeout(() => startMusic(), 200);
    setTimeout(newRound, 400);
  });
}

function newRound() {
  stopHint();
  locked = true;

  if (round >= ROUNDS) {
    // ПОБЕДА
    el.q.textContent = '🎉 Ты выучил все цвета! 🎉';
    el.shapes.innerHTML = '';
    el.sayBox.textContent = '🐻 Ура! Мы всё выучили!';
    setBearPose('happy', 'bear_happy.png');
    playVoice('win.mp3');
    return;
  }

  round++;
  el.score.textContent = 'Счёт: ' + score + ' / ' + ROUNDS;

  // Выбираем правильный цвет
  target = COLORS[Math.floor(Math.random() * COLORS.length)];

  // Собираем варианты
  const count = Math.min(settings.diff, COLORS.length);
  opts = [target];
  let guard = 0;
  while (opts.length < count && guard++ < 300) {
    const r = COLORS[Math.floor(Math.random() * COLORS.length)];
    if (!opts.includes(r)) opts.push(r);
  }
  opts.sort(() => Math.random() - 0.5);

  // Вопрос
  el.q.textContent = 'Найди цвет: «' + target.name.toUpperCase() + '»!';
  el.sayBox.textContent = '🐻 Найди ' + target.name + '!';

  // Кнопки
  el.shapes.className = 'shapes g' + count;
  el.shapes.innerHTML = '';
  opts.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'shape';
    btn.style.backgroundColor = c.hex;
    if (c.name === 'белый') btn.dataset.white = '1';
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = c.name;
    btn.appendChild(label);
    btn.onclick = () => handleAnswer(c, btn);
    el.shapes.appendChild(btn);
  });

  locked = false;
  setBearPose('idle', 'bear_idle.png');
  startBearWalk();

  // Озвучиваем вопрос + таймер подсказки
  playVoice(target.file, () => {
    if (!locked && !isHinting) startHintTimer();
  });
}

function handleAnswer(color, btnEl) {
  if (locked) return;

  // Если мишка как раз подсказывает — остановим подсказку
  if (isHinting) stopHint();
  clearTimeout(hintTimer);

  const rect = btnEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  if (color.name === target.name) {
    // ========== ПРАВИЛЬНО ==========
    locked = true;
    score++;
    btnEl.classList.add('ok');
    el.score.textContent = 'Счёт: ' + score + ' / ' + ROUNDS;
    setBearPose('happy', 'bear_happy.png');

    const praise = PRAISE[Math.floor(Math.random() * PRAISE.length)];
    el.sayBox.textContent = '🐻 Молодец! Это ' + color.name + '!';

    playVoice(praise, () => {
      setTimeout(() => {
        setBearPose('idle', 'bear_idle.png');
        newRound();
      }, 400);
    });

    // Через 3 сек на всякий случай продолжаем — если MP3 не сработал
    setTimeout(() => {
      if (locked && !isHinting && round === ROUNDS - (ROUNDS - round)) {
        // no-op
      }
    }, 4000);
  } else {
    // ========== НЕПРАВИЛЬНО ==========
    locked = true;
    btnEl.classList.add('no');
    setTimeout(() => btnEl.classList.remove('no'), 600);

    setBearPose('sad', 'bear_sad.png');
    el.sayBox.textContent = '🐻 Ничего страшного! Ищем ' + target.name + '!';

    // Играем enc_<target>.mp3 — запись «Ничего страшного! Ищи красный» (правильного цвета!)
    playVoice(target.encFile, () => {
      setBearPose('idle', 'bear_idle.png');
      // Подсветим правильную кнопку
      const buttons = el.shapes.querySelectorAll('.shape');
      buttons.forEach(b => {
        const lbl = b.querySelector('.label');
        if (lbl && lbl.textContent === target.name) {
          b.classList.add('hint');
          setTimeout(() => b.classList.remove('hint'), 2000);
        }
      });
      locked = false;
      // Перезапускаем таймер подсказки
      startHintTimer();
    });
  }
}

// ============================================================
//  КНОПКИ УПРАВЛЕНИЯ
// ============================================================
function toggleMusic() {
  getCtx();
  musicOn = !musicOn;
  settings.musicOn = musicOn;
  saveSettings();
  el.musicBtn.textContent = musicOn ? '🎵' : '🔕';
  if (musicOn) startMusic(); else pauseMusic();
}

function toggleSound() {
  soundOn = !soundOn;
  settings.soundOn = soundOn;
  saveSettings();
  el.soundBtn.textContent = soundOn ? '🔊' : '🔇';
  if (!soundOn) {
    if (currentVoice) { try { currentVoice.pause(); } catch (e) {} }
    if (currentHintVoice) { try { currentHintVoice.pause(); } catch (e) {} }
  }
}

function openSettings() { document.getElementById('settingsScreen').classList.add('on'); }
function closeSettings() {
  document.getElementById('settingsScreen').classList.remove('on');
  saveSettings();
}

function setDiff(n, btn) {
  settings.diff = n;
  document.querySelectorAll('#optDiff button').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  saveSettings();
}

function setTime(ms, btn) {
  settings.timeMs = ms;
  document.querySelectorAll('#optTime button').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  saveSettings();
  if (started && !locked) startHintTimer();
}

function setVol(v, btn) {
  settings.vol = v;
  if (v === 0) {
    musicOn = false;
    pauseMusic();
    el.musicBtn.textContent = '🔕';
  } else {
    musicOn = true;
    if (started) setTimeout(() => startMusic(), 50);
    el.musicBtn.textContent = '🎵';
  }
  document.querySelectorAll('#optVol button').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  if (musicGainNode) musicGainNode.gain.value = v;
  saveSettings();
}

// ============================================================
//  ИНИЦИАЛИЗАЦИЯ UI (активные кнопки настроек)
// ============================================================
document.querySelectorAll('#optDiff button').forEach(b => {
  const n = parseInt(b.dataset.val, 10);
  if (n === settings.diff) b.classList.add('sel'); else b.classList.remove('sel');
});
document.querySelectorAll('#optTime button').forEach(b => {
  const ms = parseInt(b.dataset.val, 10);
  if (ms === settings.timeMs) b.classList.add('sel'); else b.classList.remove('sel');
});
document.querySelectorAll('#optVol button').forEach(b => {
  const v = parseFloat(b.dataset.val);
  if (Math.abs(v - settings.vol) < 0.001) b.classList.add('sel'); else b.classList.remove('sel');
});

el.musicBtn.textContent = settings.musicOn ? '🎵' : '🔕';
el.soundBtn.textContent = settings.soundOn ? '🔊' : '🔇';
el.score.textContent = 'Счёт: 0 / ' + ROUNDS;
</script>
